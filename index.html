<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OTDraw — OT/ICS Topology Diagrams</title>
<style>
:root{
  --bg:#0b1120; --panel:#0f1626; --panel2:#131c30;
  --border:#1e2a44; --border2:#2a3a5c;
  --text:#e2e8f0; --muted:#8b9bb4; --faint:#5b6b85;
  --accent:#38bdf8; --card:#161f31;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:13px;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#topbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
#logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;
  letter-spacing:.2px;margin-right:6px}
#logo .sub{font-size:10.5px;font-weight:500;color:var(--faint);margin-left:2px;margin-top:3px}
.tgroup{display:flex;align-items:center;gap:3px;padding:3px;
  background:var(--panel2);border:1px solid var(--border);border-radius:10px}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
button{font-family:inherit;font-size:12.5px;color:var(--muted);background:transparent;
  border:none;border-radius:7px;height:30px;min-width:30px;padding:0 8px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;white-space:nowrap}
button:hover{background:#1b2740;color:var(--text)}
button:active{transform:translateY(.5px)}
button.active{background:#1d3a5c;color:var(--accent)}
button:disabled{opacity:.35;cursor:default;background:transparent;color:var(--muted)}
button svg{display:block;flex:0 0 auto}
#zoomPct{min-width:52px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn-text{font-weight:600}
#main{flex:1;display:flex;min-height:0;position:relative}
#palette{width:212px;flex:0 0 212px;background:var(--panel);
  border-right:1px solid var(--border);overflow-y:auto;padding:12px 10px 24px}
#palette::-webkit-scrollbar{width:8px}
#palette::-webkit-scrollbar-thumb{background:#22304e;border-radius:4px}
.pgroup{margin-bottom:14px}
.pgroup h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--faint);font-weight:700;padding:4px 6px 8px}
.pitems{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pitem{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:grab;transition:border-color .12s,background .12s}
.pitem:hover{border-color:var(--border2);background:#182338}
.pitem:active{cursor:grabbing}
.pitem .pic{width:34px;height:34px;border-radius:9px;display:flex;
  align-items:center;justify-content:center}
.pitem .pname{font-size:11px;color:var(--muted);font-weight:500}
#canvasWrap{flex:1;position:relative;min-width:0;background:var(--bg)}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#canvas.tool-select{cursor:default}
#canvas.tool-connect{cursor:crosshair}
#canvas.tool-zone{cursor:crosshair}
#canvas.tool-lane{cursor:crosshair}
#canvas.tool-pan{cursor:grab}
#canvas.panning{cursor:grabbing !important}
#canvas.tool-connect g.nodeg{cursor:crosshair}
g.zoneg{cursor:move}
g.nodeg{cursor:move}
.ports{opacity:0;transition:opacity .13s}
g.nodeg:hover .ports{opacity:1}
.port{cursor:crosshair}
.port:hover{stroke-width:2.5}
.edge{cursor:pointer}
.edge:hover .vis{stroke:#9db2d0}
.edge.sel .vis{stroke:#7dd3fc}
.vis.anim{animation:dashflow .8s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-28}}
/* flowing particle: small glowing dot travels along the edge path via SMIL animateMotion */
.edge .flow-dot{opacity:0}
.edge.has-flow .flow-dot{opacity:.85}
#hintbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(15,22,38,.85);border:1px solid var(--border);border-radius:99px;
  padding:6px 16px;font-size:11px;color:var(--faint);pointer-events:none;white-space:nowrap}
#hintbar b{color:var(--muted);font-weight:600}
#props{position:absolute;top:12px;right:12px;width:224px;display:none;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#props h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--faint);font-weight:700;margin-bottom:9px}
#props label{display:block;font-size:10.5px;color:var(--faint);margin:9px 0 3px;
  text-transform:uppercase;letter-spacing:.8px}
#props input[type=text],#props select{width:100%;background:#0e1626;color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:7px 9px;
  font-size:12.5px;font-family:inherit;outline:none}
#props input:focus,#props select:focus{border-color:#2f6fa8}
#props .danger{width:100%;justify-content:center;background:#3a1622;color:#fda4af;
  border:1px solid #58202f;margin-top:10px}
#props .danger:hover{background:#4c1b2b}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:7px;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--panel2);
  border:1px solid var(--border);color:var(--muted);cursor:pointer}
.chip.on{background:#1d3a5c;color:var(--accent);border-color:#2f6fa8}
#labelEditor{position:absolute;display:none;z-index:50;width:150px;text-align:center;
  background:#0c1322;border:1px solid var(--accent);color:var(--text);border-radius:7px;
  padding:5px 8px;font-size:12px;font-family:inherit;outline:none;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
.overlay{position:fixed;inset:0;background:rgba(5,9,18,.72);display:none;
  align-items:center;justify-content:center;z-index:200}
.modal{width:min(440px,92vw);background:var(--panel);border:1px solid var(--border2);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px}
.mbody{padding:16px 20px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.primary{background:#1d3a5c;color:var(--accent);border:1px solid #2f6fa8}
.primary:hover{background:#234a75;color:var(--accent)}
#examplesMenu{position:absolute;top:52px;right:14px;display:none;z-index:100;
  background:var(--panel);border:1px solid var(--border2);border-radius:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.5);padding:6px;min-width:180px}
#examplesMenu button{width:100%;justify-content:flex-start;padding:7px 12px}
#toast{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);
  background:rgba(15,22,38,.92);border:1px solid var(--border);border-radius:8px;
  padding:8px 16px;font-size:12px;color:var(--text);display:none;z-index:90;
  pointer-events:none;transition:opacity .3s}
body.presenting #palette,body.presenting #hintbar,body.presenting #props,body.presenting #topbar{display:none !important}
body.presenting #canvasWrap{position:absolute;inset:0}
#presentBar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;
  align-items:center;gap:14px;background:rgba(15,22,38,.92);border:1px solid var(--border2);
  border-radius:99px;padding:10px 22px;z-index:150}
#presentBar #pjCaption{color:var(--text);font-size:13px;max-width:500px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#presentBar #pjCounter{color:var(--accent);font-size:12px;font-variant-numeric:tabular-nums}
#presentBar button{min-width:36px;height:32px}
#journey{position:fixed;inset:0;background:rgba(5,9,18,.72);display:none;
  align-items:center;justify-content:center;z-index:200}
#journey .modal{width:min(520px,92vw);max-height:80vh;overflow-y:auto}
#jBody{padding:16px 20px}
#pickBar{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:none;
  align-items:center;gap:12px;background:rgba(15,22,38,.92);border:1px solid var(--accent);
  border-radius:99px;padding:8px 18px;z-index:150;color:var(--text);font-size:12px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/>
        <path d="M10.8 7.1 6.2 16.1M13.2 7.1l4.6 9M7.4 18h9.2"/>
      </svg>
      OTDraw <span class="sub">OT / ICS topology</span>
    </div>
    <div class="tgroup" id="tools">
      <button data-tool="select" class="active" title="Select / Move (V)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 3l14 8.5-6.2 1.4L9.5 19z"/></svg></button>
      <button data-tool="connect" title="Connect (C)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5.5" cy="18.5" r="2.8"/><circle cx="18.5" cy="5.5" r="2.8"/><path d="M7.6 16.4 16.4 7.6"/></svg></button>
      <button data-tool="zone" title="Draw zone (Z)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="14" rx="3.5" stroke-dasharray="4.2 3.2"/></svg></button>
      <button data-tool="lane" title="Swimlanes (L)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M8 4v16"/></svg></button>
      <button data-tool="pan" title="Pan (H or Space)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10m0-5.5a1.5 1.5 0 0 1 3 0V10m0-4a1.5 1.5 0 0 1 3 0v5m0-2.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.8a6 6 0 0 1-4.9-2.6L4.6 15c-.9-1.3-.4-2.8 1-3.2.9-.2 1.8.2 2.3 1l.9 1.4"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="tgroup">
      <button id="btnZoomOut" title="Zoom out"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="zoomPct" title="Reset to 100%">100%</button>
      <button id="btnZoomIn" title="Zoom in"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="btnFit" title="Fit (F)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5 4 9.5 8.5 14"/><path d="M4 9.5h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="btnGrid" title="Toggle grid snap (G)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="1.2"/><circle cx="12" cy="6" r="1.2"/><circle cx="18" cy="6" r="1.2"/><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/><circle cx="6" cy="18" r="1.2"/><circle cx="12" cy="18" r="1.2"/><circle cx="18" cy="18" r="1.2"/></svg></button>
    </div>
    <div class="spacer"></div>
    <div class="tgroup">
      <button id="btnExamples" title="Examples"><span class="btn-text">Examples</span></button>
      <button id="btnJourney" title="Journey builder / present (J)"><span class="btn-text">Journey</span></button>
      <button id="btnSave" title="Save JSON (Ctrl+S)"><span class="btn-text">Save</span></button>
      <button id="btnOpen" title="Open JSON"><span class="btn-text">Open</span></button>
      <button id="btnPuml" title="Import / export PlantUML"><span class="btn-text">PlantUML</span></button>
      <button id="btnIngest" title="Ingest running-config / CMDB"><span class="btn-text">Ingest</span></button>
      <button id="btnPng" title="Export PNG"><span class="btn-text">PNG</span></button>
      <button id="btnClear" title="Clear"><span class="btn-text">Clear</span></button>
    </div>
  </div>
  <div id="main">
    <div id="palette"></div>
    <div id="canvasWrap">
      <svg id="canvas" class="tool-select" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="gridPat" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r="1.2" fill="#1b2742"/></pattern>
          <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2537"/><stop offset="1" stop-color="#141b2b"/></linearGradient>
          <filter id="nodeShadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.42"/></filter>
          <marker id="arrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 1.2 L8.5 5 L0.5 8.8 z" fill="context-stroke"/></marker>
          <marker id="arrowSel" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0.5 1.2 L8.5 5 L0.5 8.8 z" fill="#7dd3fc"/></marker>
          <filter id="flowGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <rect id="gridRect" width="100%" height="100%" fill="url(#gridPat)" style="display:none"/>
        <g id="worldG"><g id="gZones"></g><g id="gEdges"></g><g id="gNodes"></g><g id="gTemp"></g><g id="gUI"></g></g>
      </svg>
      <div id="hintbar"><b>V</b> select · <b>C</b> connect · <b>Z</b> zone · <b>L</b> lanes · <b>H</b> pan · drag ports to link · <b>dbl-click</b> rename · <b>Del</b> delete · <b>G</b> grid · <b>F</b> fit</div>
      <div id="props">
        <h3 id="propsTitle">Properties</h3>
        <label>Label</label>
        <input id="pLabel" type="text" placeholder="label">
        <label>Color</label>
        <div id="pSwatches" class="swatches"></div>
        <div id="pEffects"></div>
        <div id="pEdgeOpts"></div>
        <div id="pLanes"></div>
        <div id="pDetails"></div>
        <button id="pDuplicate" title="Duplicate (node only)">Duplicate</button>
        <button class="danger" id="pDelete">Delete</button>
      </div>
      <input id="labelEditor" type="text" placeholder="label">
      <div id="examplesMenu"></div>
      <div id="toast"></div>
    </div>
  </div>
</div>
<div id="journey"><div class="modal">
  <header>Journey builder<button id="jClose" title="Close (Esc)">✕</button></header>
  <div id="jBody"></div>
</div></div>
<div id="presentBar">
  <button id="pjPrev" title="Previous (←)">◀</button>
  <span id="pjCaption"></span>
  <span id="pjCounter"></span>
  <button id="pjNext" title="Next (→ / Space)">▶</button>
  <button id="pjExit" title="Exit (Esc)">✕</button>
</div>
<div id="pickBar">Click / shift-click / marquee to select · Enter apply · Esc cancel</div>
<div class="overlay" id="confirmOverlay"><div class="modal">
  <header>Clear canvas<button id="cfClose">✕</button></header>
  <div class="mbody">Remove all nodes, links and zones?<div class="mrow">
    <button id="cfCancel">Cancel</button><button class="primary" id="cfOk">Clear</button>
  </div></div>
</div></div>
<script>

/* ---- orthogonal channel router: spreads parallel edges across the row gap (ELK-style) ----
   Edges between the same two rows share a gap; each gets its own horizontal channel
   (evenly spaced), exit/entry points fan out along node edges, labels sit on their
   own channel — no stacked lines, no stacked labels. ---- */
let ORTHO_ROUTES=new Map();
function computeOrthoRoutes(){
  ORTHO_ROUTES=new Map();
  const es=state.edges.filter(e=>e.mode==='ortho'&&nodeById(e.a)&&nodeById(e.b));
  if(!es.length)return;
  const groups=new Map();
  for(const e of es){
    const a=nodeById(e.a),b=nodeById(e.b);
    const rev=a.y>b.y;                 /* rev: logical source is the LOWER node */
    const hi=rev?b:a,lo=rev?a:b;
    const key=hi.y+'|'+lo.y;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push({e,hi,lo,rev});
  }
  for(const arr of groups.values()){
    const sameRow=Math.abs(arr[0].hi.y-arr[0].lo.y)<2;
    let gapTop,gapBot;
    if(sameRow){gapTop=arr[0].hi.y+nodeH(arr[0].hi)+8;gapBot=gapTop+Math.max(36,arr.length*24);}
    else{gapTop=arr[0].hi.y+nodeH(arr[0].hi);gapBot=arr[0].lo.y;}
    /* sort for nesting (fewer channel crossings) */
    arr.sort((A,B)=>(A.hi.x+A.lo.x)-(B.hi.x+B.lo.x));
    const n=arr.length;
    /* fan exit/entry x across node width when several edges share a node */
    const bySrc=new Map(),byDst=new Map();
    for(const r of arr){
      if(!bySrc.has(r.hi.id))bySrc.set(r.hi.id,[]);
      bySrc.get(r.hi.id).push(r);
      if(!byDst.has(r.lo.id))byDst.set(r.lo.id,[]);
      byDst.get(r.lo.id).push(r);
    }
    for(const list of bySrc.values()){list.sort((A,B)=>A.lo.x-B.lo.x);list.forEach((r,j)=>{r.ex=r.hi.x+nodeW(r.hi)*(j+1)/(list.length+1);});}
    for(const list of byDst.values()){list.sort((A,B)=>A.hi.x-B.hi.x);list.forEach((r,j)=>{r.tx=r.lo.x+nodeW(r.lo)*(j+1)/(list.length+1);});}
    /* detect straight-vertical edges that pierce an intermediate node → detour around it */
    for(const r of arr){
      const direct=r.ex===r.tx;
      if(!direct)continue;
      const blocker=state.nodes.find(nn=>{
        if(nn.id===r.hi.id||nn.id===r.lo.id)return false;
        return r.ex>nn.x-6&&r.ex<nn.x+nodeW(nn)+6&&nn.y>r.hi.y+nodeH(r.hi)&&nn.y+nodeH(nn)<r.lo.y;
      });
      if(blocker){
        /* detour x: just outside the blocker (and the widest node in its row) */
        const rowMates=state.nodes.filter(nn=>Math.abs(nn.y-blocker.y)<2&&nn.id!==blocker.id);
        let rightmost=blocker.x+nodeW(blocker);
        rowMates.forEach(m=>{rightmost=Math.max(rightmost,m.x+nodeW(m));});
        const dxr=rightmost+18;                       /* detour channel x (right of row) */
        r.detour=dxr;
      }
    }
    for(let i=0;i<n;i++){
      const r=arr[i];
      const cy=gapTop+(i+1)*(gapBot-gapTop)/(n+1);      /* this edge's private channel */
      const sy=r.hi.y+nodeH(r.hi);                       /* exit: bottom of upper node */
      const dy=sameRow?r.lo.y+nodeH(r.lo):r.lo.y;        /* entry: top of lower node (bottom if same row) */
      let pts;
      if(r.detour){
        /* detour: go right around the blocker node, then back to target — pure orthogonal */
        const bx=r.detour;
        pts=[{x:r.ex,y:sy},{x:r.ex,y:sy+14},{x:bx,y:sy+14},{x:bx,y:dy-14},{x:r.tx,y:dy-14},{x:r.tx,y:dy}];
      }else{
        pts=[{x:r.ex,y:sy},{x:r.ex,y:cy},{x:r.tx,y:cy},{x:r.tx,y:dy}];
      }
      if(r.rev)pts=pts.slice().reverse();                /* keep arrowhead on the logical target */
      /* label position: channel midpoint, shifted along the channel to dodge node columns.
         Check label rect (approx 120x22) against node rects near the channel y. */
      const approxW=120,approxH=22;
      const nodesNear=state.nodes.filter(nn=>{
        const top=nn.y,bottom=nn.y+nodeH(nn);
        return cy+approxH/2>top-6&&cy-approxH/2<bottom+6;  /* label rect overlaps node y-range */
      });
      const nodeRanges=nodesNear.map(nn=>({x0:nn.x-4,x1:nn.x+nodeW(nn)+4}));
      let lx=(r.ex+r.tx)/2,ly=cy,fallback=true;
      const base=lx;
      for(let t=0;t<=12;t++){
        const cand=base+((t+1)>>1)*(t%2?-1:1)*Math.abs(r.tx-r.ex)/14;
        const lx0=cand-approxW/2,lx1=cand+approxW/2;
        if(nodeRanges.every(nr=>lx1<nr.x0||lx0>nr.x1)){lx=cand;fallback=false;break;}
        if(t===12)lx=cand;
      }
      if(fallback){
        /* no free horizontal spot: put the label beside the detour/vertical run */
        if(r.detour){
          lx=r.detour+approxW/2+10;                    /* right of the detour channel */
        }else{
          lx=(r.ex<=r.tx?Math.max(r.ex,r.tx)+approxW/2+10:Math.min(r.ex,r.tx)-approxW/2-10);
        }
        ly=(sy+dy)/2;
      }
      ORTHO_ROUTES.set(r.e.id,{d:'M '+pts.map(p=>p.x+' '+p.y).join(' L '),mid:{x:lx,y:ly}});
    }
  }
  /* ---- post-processing: re-route edges that pierce non-endpoint nodes ----
     For each piercing segment, find the nearest free corridor (x for vertical,
     y for horizontal) that doesn't intersect any non-endpoint node, and splice
     it in. Iterate until stable. ---- */
  function findCorridor(axis,fixed,range0,range1,nodes,skipIds){
    const lo=Math.min(range0,range1),hi=Math.max(range0,range1);
    const blockers=nodes.filter(n=>!skipIds.has(n.id));
    const base=fixed;
    for(let d=0;d<=2000;d+=20){
      for(const sign of d===0?[1]:[1,-1]){
        const v=base+d*sign;
        const ok=blockers.every(n=>{
          if(axis==='x'){
            return !(v>n.x+2&&v<n.x+nodeW(n)-2&&n.y+nodeH(n)>lo+2&&n.y<hi-2);
          }else{
            return !(v>n.y+2&&v<n.y+nodeH(n)-2&&n.x+nodeW(n)>lo+2&&n.x<hi-2);
          }
        });
        if(ok)return v;
      }
    }
    return base;
  }
  /* ---- second pass: for edges still piercing nodes, re-route via the right margin ----
     Find the rightmost node x across the full diagram, then route: exit right, run
     along the margin, re-enter at the target. This is the "bus channel" approach
     used by ELK for dense mesh topologies. ---- */
  const rightMargin=Math.max(...state.nodes.map(n=>n.x+nodeW(n)))+40;
  const leftMargin=Math.min(...state.nodes.map(n=>n.x))-40;
  for(const [eid,route] of ORTHO_ROUTES){
    const e=state.edges.find(x=>x.id===eid);if(!e)continue;
    const skip=new Set([e.a,e.b]);
    let pts=route.d.replace("M ","").split(" L ").map(s=>s.split(" ").map(Number).map(Math.round));
    /* check if still piercing after the iterative fix */
    let piercing=false;
    for(let i=0;i<pts.length-1;i++){
      const[px,py]=pts[i],[qx,qy]=pts[i+1];
      for(const n of state.nodes){
        if(skip.has(n.id))continue;
        if(px===qx&&px>n.x+3&&px<n.x+nodeW(n)-3&&n.y+nodeH(n)>Math.min(py,qy)+2&&n.y<Math.max(py,qy)-2){piercing=true;break;}
        if(py===qy&&py>n.y+3&&py<n.y+nodeH(n)-3&&n.x+nodeW(n)>Math.min(px,qx)+2&&n.x<Math.max(px,qx)-2){piercing=true;break;}
      }
      if(piercing)break;
    }
    if(piercing){
      const aN=nodeById(e.a),bN=nodeById(e.b);
      const aRight=aN.x+nodeW(aN),bRight=bN.x+nodeW(bN);
      const aLeft=aN.x,bLeft=bN.x;
      /* pick the closer margin */
      const useRight=(Math.abs(rightMargin-aRight)+Math.abs(rightMargin-bRight))<(Math.abs(aLeft-leftMargin)+Math.abs(bLeft-leftMargin));
      const mx=useRight?rightMargin:leftMargin;
      const ax=useRight?aRight:aLeft, bx=useRight?bRight:bLeft;
      const ay=aN.y+nodeH(aN)/2, by=bN.y+nodeH(bN)/2;
      pts=[{x:ax,y:ay},{x:mx,y:ay},{x:mx,y:by},{x:bx,y:by}];
      route.d='M '+pts.map(p=>p[0]+' '+p[1]).join(' L ');
      /* label: spread margin-routed edges along the vertical run to avoid stacking */
      const myLabel=(ay+by)/2;
      route.mid={x:mx+(useRight?28:-28),y:myLabel};
      route._margin=true;
    }
  }
  /* spread labels of margin-routed edges that share the same margin x */
  const marginLabels=[...ORTHO_ROUTES.entries()].filter(([k,v])=>v._margin);
  if(marginLabels.length){
    marginLabels.sort((a,b)=>a[1].mid.y-b[1].mid.y);
    for(let i=0;i<marginLabels.length;i++){
      const[,route]=marginLabels[i];
      /* nudge y to avoid overlapping with neighbors */
      for(let t=1;t<marginLabels.length;t++){
        const j=i+t;
        if(j>=marginLabels.length)break;
        const other=marginLabels[j][1];
        if(Math.abs(route.mid.y-other.mid.y)<22){
          other.mid.y=route.mid.y+22*Math.sign(other.mid.y-route.mid.y||1);
        }
      }
    }
  }
}
/* ===================== swimlanes ===================== */
function laneRects(z){
  const rects=[];const titleH=26,headerW=22,laneH=(z.h-titleH)/z.lanes.length;
  if(z.orient==='h'){for(let i=0;i<z.lanes.length;i++)rects.push({x:z.x+headerW,y:z.y+titleH+i*laneH,w:z.w-headerW,h:laneH});}
  else{const headerH=22,laneW=(z.w)/z.lanes.length;for(let i=0;i<z.lanes.length;i++)rects.push({x:z.x+i*laneW,y:z.y+titleH,w:laneW,h:z.h-titleH});}
  return rects;
}
function laneSnapPoint(x,y){
  if(!snapOn)return{x,y,lane:null};
  for(const z of state.zones){
    if(z.kind!=='swimlane'||!inZone(x,y,z))continue;
    const rects=laneRects(z);
    for(const r of rects){
      const cl=z.orient==='h'?r.y+r.h/2:r.x+r.w/2;
      const pt=z.orient==='h'?y:x;
      if(Math.abs(pt-cl)<=LANE_SNAP)return z.orient==='h'?{x,y:cl,lane:r}:{x:cl,y,lane:r};
    }
  }
  return{x,y,lane:null};
}
/* ===================== rendering ===================== */
function renderNode(n){
  const st=elemState(n.id);
  if(st==='hidden')return null;
  const g=el('g',{class:'nodeg',transform:`translate(${n.x},${n.y})`,'data-id':n.id});
  if(st==='dim'){g.setAttribute('opacity','.13');g.style.pointerEvents='none';}
  const on=sel&&sel.type==='node'&&sel.id===n.id;
  const inMulti=picking&&multiSel.includes(n.id);
  const w=nodeW(n),h=nodeH(n),sh=TYPES[n.type]?.shape;
  if(inMulti){g.appendChild(el('rect',{x:-4,y:-4,width:w+8,height:h+8,rx:14,fill:'none',stroke:'#7dd3fc','stroke-width':2,'stroke-dasharray':'6 4'}));}
  if(n.fx&&n.fx.halo){g.appendChild(el('rect',{x:-8,y:-8,width:w+16,height:h+16,rx:16,fill:'none',stroke:n.color,'stroke-width':2,'opacity':.4}));}
  if(sh==='flow'){
    let pathD='';
    switch(n.type){
      case'startend':pathD=`M ${w/2-12} 0 h ${w-24} a12 12 0 0 1 0 ${h} h -${w-24} a12 12 0 0 1 0 -${h} z`;break;
      case'process':pathD=`M 0 4 Q 0 0 4 0 h ${w-8} q 4 0 4 4 v ${h-8} q 0 4 -4 4 h -${w-8} q -4 0 -4 -4 z`;break;
      case'decision':pathD=`M ${w/2} 0 L ${w} ${h/2} L ${w/2} ${h} L 0 ${h/2} z`;break;
      case'dataio':pathD=`M ${w*.1} 0 h ${w*.8} L ${w} ${h/2} L ${w*.9} ${h} H ${w*.1} L 0 ${h/2} z`;break;
      case'document':pathD=`M 0 0 h ${w} v ${h*.7} q 0 6 -${w*.2} 4 q -${w*.3} -2 -${w*.2} 4 q -${w*.3} 6 -${w*.2} 4 q -${w*.2} -2 -${w*.2} 4 v -${h*.7} z`;break;
      case'predefined':pathD=`M 4 0 h ${w-8} v ${h} h -${w-8} z M 8 0 v ${h} M ${w-8} 0 v ${h}`;break;
      case'preparation':pathD=`M 8 0 h ${w-16} L ${w} ${h/2} L ${w-8} ${h} h -${w-16} L 0 ${h/2} z`;break;
      case'manualinput':pathD=`M 0 ${h} v -${h*.7} L ${w} ${h*.3} v ${h*.7} z`;break;
      case'delay':pathD=`M 0 0 h ${w} v ${h} h -${w} q -8 -${h/2} 0 -${h} z`;break;
      case'connector':pathD=`M ${w/2} 0 a ${w/2} ${h/2} 0 1 0 ${.2} ${h/2} a ${w*.3} ${h*.3} 0 0 0 0 -${h*.3} z`;break;
      default:pathD=`M 0 0 h ${w} v ${h} h -${w} z`;
    }
    g.appendChild(el('path',{d:pathD,fill:'url(#cardGrad)',stroke:on?'#7dd3fc':n.color,'stroke-opacity':on?1:.7,'stroke-width':on?1.8:1.4,filter:'url(#nodeShadow)'}));
    if(n.type==='startend'){const t=el('text',{x:w/2,y:h/2+4.2,'text-anchor':'middle','dominant-baseline':'middle',fill:'#dbe4f0','font-size':12,'font-weight':600});t.textContent=n.label;g.appendChild(t);}
    else{const t=el('text',{x:w/2,y:h/2+4.2,'text-anchor':'middle',fill:'#dbe4f0','font-size':12,'font-weight':600});t.textContent=n.label;g.appendChild(t);}
  }else{
    const acc=n.color||typeColor(n.type);
    const isThreat=TYPES[n.type]?.cat==='Threats';
    g.appendChild(el('rect',{class:'card',x:0,y:0,width:w,height:h,rx:14,fill:'url(#cardGrad)',stroke:on?acc:(isThreat?'rgba(248,113,113,.4)':'rgba(148,163,184,.20)'),'stroke-width':on?1.6:1,filter:'url(#nodeShadow)'}));
    if(isThreat&&!on)g.lastChild.setAttribute('stroke-dasharray','5 3.5');
    /* icon chip: centered, accent-tinted background box */
    g.appendChild(el('rect',{x:w/2-19,y:8,width:38,height:38,rx:11,fill:acc,opacity:.13}));
    const ig=el('g',{transform:`translate(${w/2-13.8},${13.2}) scale(1.15)`,fill:'none',stroke:acc,'stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round'});
    ig.innerHTML=ICONS[n.type]||'';
    g.appendChild(ig);
    const t=el('text',{x:w/2,y:62,'text-anchor':'middle',fill:'#cbd5e1','font-size':11.5,'font-weight':600});t.textContent=n.label;g.appendChild(t);
    const ml=metaLines(n);
    ml.forEach((line,i)=>{
      const y=76+i*13;
      /* highlighted tag style for known keys (VLAN, Port, IP, MAC, Protocol) */
      const isTag=/^(vlan|port|ip|mac|protocol|subnet|gateway|interface|ssid)/i.test(line);
      const m=el('text',{x:w/2,y,'text-anchor':'middle',fill:isTag?'#7dd3fc':'#7d8fae','font-size':9.5,'font-family':'ui-monospace, Consolas, monospace'});
      m.textContent=line;g.appendChild(m);
    });
    const ports=el('g',{class:'ports'});
    [[w/2,0],[w,h/2],[w/2,h],[0,h/2]].forEach(([px,py])=>{
      ports.appendChild(el('circle',{class:'port',cx:px,cy:py,r:5,fill:'#0d1526',stroke:acc,'stroke-width':1.6,'data-node':n.id}));
    });
    g.appendChild(ports);
  }
  return g;
}

function renderEdge(e){

  const stA=elemState(e.a),stB=elemState(e.b);
  if(stA==='hidden'||stB==='hidden')return null;
  const dimmed=stA==='dim'||stB==='dim';
  const route=ORTHO_ROUTES.get(e.id);
  const gm=route||edgeGeom(e.a,e.b,e.mode);if(!gm)return null;
  const on=sel&&sel.type==='edge'&&sel.id===e.id;
  const sneak=e.dash==='sneakernet';
  const g=el('g',{class:'edge'+(on?' sel':''),'data-id':e.id});
  if(dimmed){g.setAttribute('opacity','.13');g.style.pointerEvents='none';}
  g.appendChild(el('path',{d:gm.d,fill:'none',stroke:'transparent','stroke-width':10}));
  const vis=el('path',{class:'vis'+(e.anim&&!sneak?' anim':''),d:gm.d,fill:'none',stroke:on?'#7dd3fc':(sneak?'#6b6242':'#526180'),'stroke-width':on?2.4:(sneak?1.5:2),'stroke-linecap':'round','marker-end':on?'url(#arrowSel)':'url(#arrow)'});
  const d=dashFor(e);if(d)vis.setAttribute('stroke-dasharray',d);
  g.appendChild(vis);
  /* flowing particle: glowing dot travels along the edge path (data-flow direction) */
  if(e.anim&&!sneak&&!dimmed){
    g.classList.add('has-flow');
    const dot=el('circle',{class:'flow-dot',cx:0,cy:0,r:3.5,fill:'#7dd3fc',filter:'url(#flowGlow)'});
    const am=document.createElementNS(SVGNS,'animateMotion');
    am.setAttribute('dur','2.4s');am.setAttribute('repeatCount','indefinite');
    am.setAttribute('path',gm.d);am.setAttribute('rotate','auto');
    dot.appendChild(am);
    g.appendChild(dot);
  }
  if(e.label){
    const mx=gm.mid?gm.mid.x:(gm.p1.x+gm.p2.x)/2,my=gm.mid?gm.mid.y:(gm.p1.y+gm.p2.y)/2;
    const t=el('text',{});t.textContent=e.label;
    const tw=t.getBBox?t.getBBox().width+10:50;t.textContent='';
    g.appendChild(el('rect',{x:mx-tw/2,y:my-10,width:tw,height:20,rx:9,fill:'#0c1424',stroke:'#24304d','stroke-width':1}));
    const lt=el('text',{x:mx,y:my+3.6,'text-anchor':'middle',fill:'#8fa3c0','font-size':10.5});lt.textContent=e.label;g.appendChild(lt);
  }
  if(e.dash==='sneakernet'&&!dimmed)buildFootsteps(e,g);

}
function renderAll(){
  gZ.innerHTML='';gE.innerHTML='';gN.innerHTML='';gT.innerHTML='';gU.innerHTML='';
  computeOrthoRoutes();
  for(const z of state.zones)gZ.appendChild(renderZone(z));
  for(const e of state.edges){const eg=renderEdge(e);if(eg)gE.appendChild(eg);}
  for(const n of state.nodes){const ng=renderNode(n);if(ng)gN.appendChild(ng);}
  applyView();updateProps();updateToolbar();
  ensureSneakTimer();
}
/* ===================== view transform ===================== */
function toWorld(cx,cy){const r=svg.getBoundingClientRect();return{x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k};}
function toScreen(wx,wy){const r=svg.getBoundingClientRect();return{x:wx*view.k+view.x+r.left,y:wy*view.k+view.y+r.top};}
function applyView(){
  svg.setAttribute('viewBox',`0 0 ${svg.clientWidth} ${svg.clientHeight}`);
  worldG.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  $('#zoomPct').textContent=Math.round(view.k*100)+'%';
  const gr=$('#gridRect');if(gr){gr.setAttribute('x',-view.x/view.k);gr.setAttribute('y',-view.y/view.k);gr.setAttribute('width',svg.clientWidth/view.k);gr.setAttribute('height',svg.clientHeight/view.k);}
}
window.addEventListener('resize',()=>{applyView();});
function zoomBy(cx,cy,f){
  const r=svg.getBoundingClientRect(),px=cx-r.left,py=cy-r.top;
  const k2=clamp(view.k*f,.2,4);
  view.x=px-(px-view.x)*k2/view.k;view.y=py-(py-view.y)*k2/view.k;view.k=k2;applyView();
}
function contentBounds(){
  const xs=state.nodes.map(n=>n.x).concat(state.zones.map(z=>z.x));
  const ys=state.nodes.map(n=>n.y).concat(state.zones.map(z=>z.y));
  const xe=state.nodes.map(n=>n.x+nodeW(n)).concat(state.zones.map(z=>z.x+z.w));
  const ye=state.nodes.map(n=>n.y+nodeH(n)).concat(state.zones.map(z=>z.y+z.h));
  return{minX:Math.min(...xs),minY:Math.min(...ys),maxX:Math.max(...xe),maxY:Math.max(...ye)};
}
function zoomFit(){
  if(!state.nodes.length&&!state.zones.length){tweenView(0,0,1);return;}
  const b=contentBounds();
  const minX=b.minX-40,minY=b.minY-40,maxX=b.maxX+40,maxY=b.maxY+40;
  const k=clamp(Math.min(svg.clientWidth/(maxX-minX),svg.clientHeight/(maxY-minY)),.2,1.5);
  tweenView(-minX*k+((svg.clientWidth-(maxX-minX)*k)/2),-minY*k+((svg.clientHeight-(maxY-minY)*k)/2),k);
}
function tweenView(tx,ty,tk,ms=300){
  if(tweenRAF)cancelAnimationFrame(tweenRAF);
  const sv={...view},t0=performance.now();
  const step=now=>{
    const t=clamp((now-t0)/ms,0,1);
    const e=t<.5?2*t*t:1-Math.pow(1-t,2);
    view.x=sv.x+(tx-sv.x)*e;view.y=sv.y+(ty-sv.y)*e;view.k=sv.k+(tk-sv.k)*e;
    applyView();
    if(t<1)tweenRAF=requestAnimationFrame(step);else tweenRAF=null;
  };
  tweenRAF=requestAnimationFrame(step);
}
/* ===================== palette ===================== */
function buildPalette(){
  const pal=$('#palette');pal.innerHTML='';
  for(const cat of PALETTE_GROUPS){
    const grp=document.createElement('div');grp.className='pgroup';
    grp.innerHTML='<h3>'+esc(cat)+'</h3><div class="pitems"></div>';
    const items=grp.querySelector('.pitems');
    for(const key of Object.keys(TYPES).filter(k=>TYPES[k].cat===cat)){
      const it=document.createElement('div');it.className='pitem';it.dataset.shape=key;
      it.innerHTML='<div class="pic"></div><div class="pname">'+esc(key)+'</div>';
      const pic=it.querySelector('.pic');pic.style.color='var(--accent)';
      ic(pic,key);
      it.addEventListener('pointerdown',ev=>startPaletteDrag(ev,key));
      items.appendChild(it);
    }
    pal.appendChild(grp);
  }
}
function startPaletteDrag(ev,key){
  ev.preventDefault();
  const ghost=document.createElement('div');
  ghost.className='pitem';ghost.style.cssText='position:fixed;z-index:100;pointer-events:none;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12px;font-weight:600';
  ghost.textContent=key;document.body.appendChild(ghost);
  const mv=e=>{ghost.style.left=(e.clientX+12)+'px';ghost.style.top=(e.clientY+12)+'px';};
  mv(ev);
  const up=e=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
    ghost.remove();
    const r=svg.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
      const p=toWorld(e.clientX,e.clientY);
      addNode(key,snap(p.x-NW/2),snap(p.y-NH/2));setTool('select');
    }
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
}
/* ===================== selection / props ===================== */
function select(s){sel=s;renderAll();}
function hideProps(){$('#props').style.display='none';}
function updateToolbar(){
  document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool));
  $('#btnGrid')?.classList.toggle('active',snapOn);
}
function updateProps(){
  const p=$('#props');
  $('#pEffects').innerHTML='';$('#pEdgeOpts').innerHTML='';$('#pLanes').innerHTML='';$('#pDetails').innerHTML='';
  if(!sel){p.style.display='none';return;}
  if(sel.type==='node'){
    const n=nodeById(sel.id);if(!n){p.style.display='none';return;}
    $('#propsTitle').textContent='Node';
    $('#pLabel').value=n.label;
    buildSwatches(SWATCHES,n.color,c=>{n.color=c;commit();renderAll();});
    const effWrap=document.createElement('div');
    effWrap.innerHTML='<label>Effects</label><div class="chips" id="fxChips"></div>';
    const chips=effWrap.querySelector('#fxChips');
    for(const[fk,fv]of Object.entries(EFFECTS)){
      const c=document.createElement('div');c.className='chip'+(n.fx&&n.fx[fk]?' on':'');
      c.textContent=fv.label;
      c.onclick=()=>{n.fx=n.fx||{};n.fx[fk]=!n.fx[fk];commit();renderAll();};
      chips.appendChild(c);
    }
    $('#pEffects').appendChild(effWrap);
    /* ---- detail editor: add/edit/remove key-value pairs (VLAN, Port, IP, etc.) ---- */
    const dw=document.createElement('div');
    dw.innerHTML='<label>Details</label>';
    const list=document.createElement('div');
    list.style.cssText='display:flex;flex-direction:column;gap:4px';
    const renderDetails=()=>{
      list.innerHTML='';
      const entries=Object.entries(n.meta||{}).filter(([k])=>!HIDDEN_META_KEYS.has(k));
      entries.forEach(([k,v])=>{
        const row=document.createElement('div');row.style.cssText='display:flex;gap:4px;align-items:center';
        const ki=document.createElement('input');ki.type='text';ki.value=k;ki.placeholder='key';
        ki.style.cssText='width:70px;background:#0e1626;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11px;font-family:inherit;outline:none';
        const vi=document.createElement('input');vi.type='text';vi.value=v;vi.placeholder='value';
        vi.style.cssText='flex:1;background:#0e1626;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11px;font-family:inherit;outline:none';
        const rm=document.createElement('button');rm.textContent='✕';rm.style.cssText='min-width:24px;height:24px;font-size:11px';
        ki.onchange=()=>{n.meta=n.meta||{};const old=v;delete n.meta[k];n.meta[ki.value||k]=old;commit();renderDetails();renderAll();};
        vi.onchange=()=>{n.meta=n.meta||{};n.meta[k]=vi.value;commit();renderAll();};
        rm.onclick=()=>{n.meta=n.meta||{};delete n.meta[k];commit();renderDetails();renderAll();};
        row.appendChild(ki);row.appendChild(vi);row.appendChild(rm);list.appendChild(row);
      });
    };
    renderDetails();
    const addBtn=document.createElement('button');addBtn.textContent='+ Add detail';
    addBtn.style.cssText='width:100%;margin-top:5px';
    addBtn.onclick=()=>{n.meta=n.meta||{};let k='field',i=1;while(n.meta[k])k='field'+(++i);n.meta[k]='';commit();renderDetails();renderAll();};
    dw.appendChild(list);dw.appendChild(addBtn);
    $('#pDetails').appendChild(dw);
    $('#pDuplicate').style.display='';
    p.style.display='block';
  }else if(sel.type==='zone'){
    const z=zoneById(sel.id);if(!z){p.style.display='none';return;}
    $('#propsTitle').textContent=z.kind==='swimlane'?'Swimlane':'Zone';
    $('#pLabel').value=z.label;
    buildSwatches(ZONE_COLORS,z.color,c=>{z.color=c;commit();renderAll();});
    if(z.kind==='swimlane'){
      const lw=document.createElement('div');
      lw.innerHTML='<label>Lanes</label>';
      const laneList=document.createElement('div');
      const renderLanes=()=>{
        laneList.innerHTML='';
        z.lanes.forEach((ln,i)=>{
          const row=document.createElement('div');row.style.cssText='display:flex;gap:4px;margin:3px 0;align-items:center';
          const inp=document.createElement('input');inp.type='text';inp.value=ln;inp.style.cssText='flex:1;background:#0e1626;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:11.5px;font-family:inherit;outline:none';
          inp.onchange=()=>{z.lanes[i]=inp.value||z.lanes[i];commit();renderAll();};
          const rm=document.createElement('button');rm.textContent='✕';rm.style.cssText='min-width:24px;height:24px;font-size:11px';
          rm.onclick=()=>{if(z.lanes.length>1){z.lanes.splice(i,1);commit();renderLanes();renderAll();}};
          row.appendChild(inp);row.appendChild(rm);laneList.appendChild(row);
        });
      };
      renderLanes();
      const addBtn=document.createElement('button');addBtn.textContent='+ Add lane';addBtn.style.cssText='width:100%;margin-top:5px';
      addBtn.onclick=()=>{z.lanes.push('Lane '+(z.lanes.length+1));commit();renderLanes();renderAll();};
      const orientBtn=document.createElement('button');orientBtn.textContent='Rotate';
      orientBtn.style.cssText='width:100%;margin-top:5px';
      orientBtn.onclick=()=>{z.orient=z.orient==='h'?'v':'h';commit();renderAll();};
      lw.appendChild(laneList);lw.appendChild(addBtn);lw.appendChild(orientBtn);
      $('#pLanes').appendChild(lw);
    }
    $('#pDuplicate').style.display='none';
    p.style.display='block';
  }else if(sel.type==='edge'){
    const e=edgeById(sel.id);if(!e){p.style.display='none';return;}
    $('#propsTitle').textContent='Link';
    $('#pLabel').value=e.label||'';
    const ow=document.createElement('div');
    ow.innerHTML='<label>Dash</label><select id="eDash"><option value="solid">solid</option><option value="dashed">dashed</option><option value="dotted">dotted</option><option value="sneakernet">sneakernet</option><option value="animated">animated</option></select><label>Route</label><select id="eMode"><option value="curve">curve</option><option value="ortho">orthogonal</option></select><label>Animated</label><input type="checkbox" id="eAnim">';
    const dashSel=ow.querySelector('#eDash');dashSel.value=e.dash;
    dashSel.onchange=()=>{e.dash=dashSel.value;if(e.dash==='animated')e.anim=true;else e.anim=false;commit();renderAll();};
    const modeSel=ow.querySelector('#eMode');modeSel.value=e.mode;
    modeSel.onchange=()=>{e.mode=modeSel.value;commit();renderAll();};
    const animCb=ow.querySelector('#eAnim');animCb.checked=!!e.anim;
    animCb.onchange=()=>{e.anim=animCb.checked;commit();renderAll();};
    $('#pEdgeOpts').appendChild(ow);
    $('#pDuplicate').style.display='none';
    p.style.display='block';
  }
}
function buildSwatches(colors,cur,cb){
  const w=$('#pSwatches');w.innerHTML='';
  colors.forEach(c=>{
    const s=document.createElement('div');s.className='sw'+(c===cur?' on':'');s.style.background=c;
    s.onclick=()=>cb(c);w.appendChild(s);
  });
}
$('#pLabel').addEventListener('input',()=>{
  if(!sel)return;
  if(sel.type==='node'){const n=nodeById(sel.id);if(n)n.label=$('#pLabel').value;}
  if(sel.type==='zone'){const z=zoneById(sel.id);if(z)z.label=$('#pLabel').value;}
  if(sel.type==='edge'){const e=edgeById(sel.id);if(e)e.label=$('#pLabel').value;}
  renderAll();
});
$('#pLabel').addEventListener('blur',()=>{if(sel)commit();});
$('#pDelete').onclick=deleteSelection;
$('#pDuplicate').onclick=duplicateSelection;
/* ===================== tools ===================== */
function setTool(t){
  tool=t;
  document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  svg.className.baseVal='tool-'+t;
}
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
/* ===================== label editor ===================== */
const ed=$('#labelEditor');
function openEditor(obj,type){
  const r=svg.getBoundingClientRect();
  let sx,sy;
  if(type==='node'){const w=nodeW(obj),h=nodeH(obj);sx=(obj.x+w/2)*view.k+view.x+r.left;sy=(obj.y+h/2)*view.k+view.y+r.top;}
  else if(type==='zone'){sx=(obj.x+obj.w/2)*view.k+view.x+r.left;sy=(obj.y+14)*view.k+view.y+r.top;}
  else{sx=r.left+r.width/2;sy=r.top+r.height/2;}
  ed.style.display='block';
  ed.style.left=(sx-75)+'px';ed.style.top=(sy-14)+'px';
  ed.value=obj.label||'';ed.focus();ed.select();
  ed.onblur=()=>commitEditor(obj);
  ed.onkeydown=e=>{if(e.key==='Enter')ed.blur();if(e.key==='Escape'){ed.onblur=null;hideEditor();}};
}
function commitEditor(obj){obj.label=ed.value||obj.label;hideEditor();commit();renderAll();}
function hideEditor(){ed.style.display='none';ed.onblur=null;}
svg.addEventListener('dblclick',ev=>{
  const ng=ev.target.closest('g.nodeg'),zg=ev.target.closest('g.zoneg'),eg=ev.target.closest('g.edge');
  if(ng){const n=nodeById(ng.dataset.id);if(n)openEditor(n,'node');}
  else if(zg){const z=zoneById(zg.dataset.id);if(z)openEditor(z,'zone');}
  else if(eg){const e=edgeById(eg.dataset.id);if(e){e.label=e.label||'';openEditor(e,'edge');}}
});
/* ===================== pointer interaction ===================== */
svg.addEventListener('pointerdown',ev=>{
  svg.focus();
  if(present){return;}
  const pt=toWorld(ev.clientX,ev.clientY);
  const portEl=ev.target.closest('.port');
  if(portEl&&!picking){startConnect(portEl.dataset.node,pt);return;}
  if(picking){
    const ng=ev.target.closest('g.nodeg');
    if(ng){
      const id=ng.dataset.id;
      if(ev.shiftKey){if(!multiSel.includes(id))multiSel.push(id);}
      else{multiSel=[id];}
      renderAll();
    }else if(!ev.shiftKey){multiSel=[];renderAll();}
    marquee={x0:pt.x,y0:pt.y,x1:pt.x,y1:pt.y,shift:ev.shiftKey};
    return;
  }
  if(tool==='connect'){
    const ng=ev.target.closest('g.nodeg');
    if(ng){
      if(connectFrom&&connectFrom!==ng.dataset.id){finishConnect(ng.dataset.id);}
      else if(!connectFrom){connectFrom=ng.dataset.id;}
    }
    return;
  }
  if(tool==='zone'||tool==='lane'){zoneDraw={x0:pt.x,y0:pt.y,x1:pt.x,y1:pt.y};return;}
  if(tool==='pan'||spaceHeld){panning={sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y,wentPan:true};svg.classList.add('panning');return;}
  const ng=ev.target.closest('g.nodeg');
  const zg=ev.target.closest('g.zoneg');
  const egr=ev.target.closest('g.edge');
  if(ng){
    select({type:'node',id:ng.dataset.id});
    const n=nodeById(ng.dataset.id);
    drag={n,dx:pt.x-n.x,dy:pt.y-n.y,moved:false};
  }else if(egr){select({type:'edge',id:egr.dataset.id});}
  else if(zg){
    select({type:'zone',id:zg.dataset.id});
    const z=zoneById(zg.dataset.id);
    drag={zone:z,dx:pt.x-z.x,dy:pt.y-z.y,moved:false};
  }else{
    /* empty canvas: start as potential pan OR marquee.
       If drag exceeds 5px → pan; if just a click → deselect.
       Shift-click empty = marquee select (doesn't pan). */
    sel=null;renderAll();
    if(ev.shiftKey){
      marquee={x0:pt.x,y0:pt.y,x1:pt.x,y1:pt.y,shift:true};
    }else{
      panning={sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y,wentPan:false};
    }
  }
});
function startConnect(fromId,pt){
  connectFrom=fromId;
  const g=el('g',{id:'tmpLine'});
  g.appendChild(el('line',{id:'tmpline',x1:pt.x,y1:pt.y,x2:pt.x,y2:pt.y,stroke:'#7dd3fc','stroke-width':1.8,'stroke-dasharray':'5 4'}));
  gT.appendChild(g);
}
function finishConnect(toId){
  if(connectFrom&&toId&&toId!==connectFrom)addEdge(connectFrom,toId);
  connectFrom=null;gT.innerHTML='';
}
window.addEventListener('pointermove',ev=>{
  if(panning){
    const dx=ev.clientX-panning.sx,dy=ev.clientY-panning.sy;
    if(!panning.wentPan&&Math.hypot(dx,dy)>5){
      panning.wentPan=true;
      svg.classList.add('panning');
      /* re-add the selection we just cleared — we only meant to pan */
    }
    if(panning.wentPan){
      view.x=panning.vx+dx;view.y=panning.vy+dy;applyView();
    }
    return;
  }
  if(connectFrom){const l=document.getElementById('tmpline');if(l){const p=toWorld(ev.clientX,ev.clientY);l.setAttribute('x2',p.x);l.setAttribute('y2',p.y);}return;}
  if(zoneDraw){const p=toWorld(ev.clientX,ev.clientY);zoneDraw.x1=p.x;zoneDraw.y1=p.y;
    let r=document.getElementById('tmpzone');
    if(!r){r=el('rect',{id:'tmpzone',fill:'rgba(56,189,248,.06)',stroke:'#38bdf8','stroke-dasharray':'6 4'});gT.appendChild(r);}
    r.setAttribute('x',Math.min(zoneDraw.x0,zoneDraw.x1));r.setAttribute('y',Math.min(zoneDraw.y0,zoneDraw.y1));
    r.setAttribute('width',Math.abs(zoneDraw.x1-zoneDraw.x0));r.setAttribute('height',Math.abs(zoneDraw.y1-zoneDraw.y0));return;}
  if(marquee){const p=toWorld(ev.clientX,ev.clientY);marquee.x1=p.x;marquee.y1=p.y;
    let r=document.getElementById('tmpMarquee');
    if(!r){r=el('rect',{id:'tmpMarquee',fill:'rgba(56,189,248,.07)',stroke:'#38bdf8','stroke-dasharray':'4 4','stroke-width':1});gT.appendChild(r);}
    r.setAttribute('x',Math.min(marquee.x0,marquee.x1));r.setAttribute('y',Math.min(marquee.y0,marquee.y1));
    r.setAttribute('width',Math.abs(marquee.x1-marquee.x0));r.setAttribute('height',Math.abs(marquee.y1-marquee.y0));return;}
  if(drag){const p=toWorld(ev.clientX,ev.clientY);drag.moved=true;
    let nx=p.x-drag.dx,ny=p.y-drag.dy;
    if(snapOn&&drag.n){nx=snap(nx);ny=snap(ny);const ls=laneSnapPoint(nx+NW/2,ny+NH/2);nx=ls.x-NW/2;ny=ls.y-NH/2;
      if(ls.lane){gU.innerHTML='';gU.appendChild(el('rect',{x:ls.lane.x,y:ls.lane.y,width:ls.lane.w,height:ls.lane.h,fill:'rgba(125,211,252,.08)',stroke:'#7dd3fc','stroke-width':1,'stroke-dasharray':'4 3'}));}
      else gU.innerHTML='';
    }
    if(snapOn&&drag.zone){nx=snap(nx);ny=snap(ny);}
    if(drag.n){drag.n.x=nx;drag.n.y=ny;}
    if(drag.zone){
      const dx=nx-drag.zone.x,dy=ny-drag.zone.y;
      /* move all contained nodes with the zone (group move) */
      for(const n of state.nodes){
        if(inZone(n.x+nodeW(n)/2,n.y+nodeH(n)/2,drag.zone)){n.x+=dx;n.y+=dy;}
      }
      drag.zone.x=nx;drag.zone.y=ny;
    }
    renderAll();
    return;}
});
window.addEventListener('pointerup',ev=>{
  if(connectFrom){
    const ng=ev.target.closest&&ev.target.closest('g.nodeg');
    const portEl=ev.target.closest&&ev.target.closest('.port');
    if(portEl&&portEl.dataset.node!==connectFrom)finishConnect(portEl.dataset.node);
    else if(ng&&ng.dataset.id!==connectFrom)finishConnect(ng.dataset.id);
    else{connectFrom=null;gT.innerHTML='';}
    return;
  }
  if(zoneDraw){
    document.getElementById('tmpzone')?.remove();
    const w=Math.abs(zoneDraw.x1-zoneDraw.x0),h=Math.abs(zoneDraw.y1-zoneDraw.y0);
    if(w>30&&h>30)addZone(Math.min(zoneDraw.x0,zoneDraw.x1),Math.min(zoneDraw.y0,zoneDraw.y1),w,h,'zone',null,tool==='lane'?'swimlane':'zone');
    zoneDraw=null;setTool('select');return;
  }
  if(marquee){
    document.getElementById('tmpMarquee')?.remove();
    const rx1=Math.min(marquee.x0,marquee.x1),rx2=Math.max(marquee.x0,marquee.x1);
    const ry1=Math.min(marquee.y0,marquee.y1),ry2=Math.max(marquee.y0,marquee.y1);
    const hit=state.nodes.filter(n=>n.x+NW>rx1&&n.x<rx2&&n.y+NH>ry1&&n.y<ry2);
    if(picking){
      const ids=hit.map(n=>n.id);
      if(marquee.shift){for(const id of ids)if(!multiSel.includes(id))multiSel.push(id);}
      else multiSel=ids;
      renderAll();
    }else if(hit.length===1)select({type:'node',id:hit[0].id});
    else{sel=null;renderAll();}
    marquee=null;return;
  }
  panning=null;svg.classList.remove('panning');
  if(drag){if(drag.moved)commit();gU.innerHTML='';}
  drag=null;
});
/* ===================== wheel / keys ===================== */
svg.addEventListener('wheel',ev=>{ev.preventDefault();zoomBy(ev.clientX,ev.clientY,ev.deltaY<0?1.12:0.89);},{passive:false});
window.addEventListener('keydown',ev=>{
  if(ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA'||ev.target.tagName==='SELECT')return;
  if(picking){
    if(ev.key==='Enter'){endPick(true);return;}
    if(ev.key==='Escape'){endPick(false);return;}
    if(ev.key==='Delete'||ev.key==='Backspace'){ev.preventDefault();return;}
    return;
  }
  if(present){
    if(ev.key==='ArrowRight'||ev.code==='Space'){ev.preventDefault();pjNext();return;}
    if(ev.key==='ArrowLeft'){ev.preventDefault();pjPrev();return;}
    if(ev.key==='Escape'){exitPresent();return;}
    return;
  }
  if(ev.code==='Space'){spaceHeld=true;ev.preventDefault();return;}
  if(ev.ctrlKey||ev.metaKey){
    const k=ev.key.toLowerCase();
    if(k==='z'&&!ev.shiftKey){ev.preventDefault();undo();return;}
    if(k==='y'||(k==='z'&&ev.shiftKey)){ev.preventDefault();redo();return;}
    if(k==='s'){ev.preventDefault();exportJSON();return;}
    if(k==='d'){ev.preventDefault();duplicateSelection();return;}
    return;
  }
  const k=ev.key.toLowerCase();
  if(k==='v')setTool('select');
  else if(k==='c')setTool('connect');
  else if(k==='z')setTool('zone');
  else if(k==='l')setTool('lane');
  else if(k==='h')setTool('pan');
  else if(k==='f')zoomFit();
  else if(k==='g')toggleGrid();
  else if(k==='j')toggleJourney();
  else if(ev.key==='Delete'||ev.key==='Backspace')deleteSelection();

function applyLoadedDoc(doc){
  if(!doc||typeof doc!=='object')throw new Error('not an object');
  if(!Array.isArray(doc.nodes)||!Array.isArray(doc.edges)||!Array.isArray(doc.zones))throw new Error('missing nodes/edges/zones arrays');
  if(doc.nodes.length+doc.edges.length+doc.zones.length>20000)throw new Error('too many elements (max 20000)');
  const nn=doc.nodes.map(n=>({
    id:String(n.id||''),type:TYPES[n.type]?n.type:'box',x:+n.x||0,y:+n.y||0,
    label:n.label!=null?String(n.label):String(n.type||'node'),
    color:/^#[0-9a-f]{6}$/i.test(n.color||'')?n.color:SWATCHES[0],
    meta:(n.meta&&typeof n.meta==='object'&&!Array.isArray(n.meta))?n.meta:{},
    fx:(n.fx&&typeof n.fx==='object'&&!Array.isArray(n.fx))?n.fx:{},
  }));
  const ne=doc.edges.map(e=>({
    id:String(e.id||''),a:String(e.a||''),b:String(e.b||''),
    label:e.label!=null?String(e.label):'',
    dash:['solid','dashed','dotted','sneakernet','animated'].includes(e.dash)?e.dash:'solid',
    mode:e.mode==='curve'?'curve':'straight',
    anim:!!e.anim,
  }));
  const nz=doc.zones.map(z=>({
    id:String(z.id||''),x:+z.x||0,y:+z.y||0,w:Math.max(40,+z.w||80),h:Math.max(30,+z.h||60),
    label:z.label!=null?String(z.label):'zone',
    color:/^#[0-9a-f]{6}$/i.test(z.color||'')?z.color:ZONE_COLORS[0],
    kind:z.kind==='swimlane'?'swimlane':'zone',
    lanes:Array.isArray(z.lanes)&&z.lanes.length?z.lanes.map(l=>String(l)):['Lane 1'],
    orient:z.orient==='v'?'v':'h',
  }));
  const nodeIds=new Set(nn.map(n=>n.id));
  const validEdges=ne.filter(e=>nodeIds.has(e.a)&&nodeIds.has(e.b));
  let journey={steps:[]};
  if(doc.journey&&typeof doc.journey==='object'&&!Array.isArray(doc.journey)&&Array.isArray(doc.journey.steps)){
    journey={steps:doc.journey.steps.map(s=>{
      /* proto-pollution defense: strip own __proto__/constructor keys before use */
      if(s&&typeof s==='object'){delete s.__proto__;delete s.constructor;}

      if(Array.isArray(s.show))st.show=s.show.map(String);
      if(Array.isArray(s.highlight))st.highlight=s.highlight.map(String);
      return st;
    })};
  }
  state.journey=journey;
  state.nodes=nn;state.edges=validEdges;state.zones=nz;
  sel=null;hideProps();
  restoreIds();
  commit();renderAll();
}

/* GIF encoder */
function medianCut(samples,nColors){
  if(!samples.length)return new Uint8Array(nColors*3);
  const boxes=[{s:samples}];
  while(boxes.length<nColors){
    let bi=-1,br=-1;
    for(let i=0;i<boxes.length;i++){
      const s=boxes[i].s;if(s.length<2)continue;
      let rMin=255,rMax=0,gMin=255,gMax=0,bMin=255,bMax=0;
      for(let j=0;j<s.length;j++){const r=s[j*3],g=s[j*3+1],b=s[j*3+2];rMin=Math.min(rMin,r);rMax=Math.max(rMax,r);gMin=Math.min(gMin,g);gMax=Math.max(gMax,g);bMin=Math.min(bMin,b);bMax=Math.max(bMax,b);}
      const r=Math.max(rMax-rMin,gMax-gMin,bMax-bMin);
      if(r>br){br=r;bi=i;}
    }
    if(bi<0)break;
    const box=boxes[bi];
    let rMin=255,rMax=0,gMin=255,gMax=0,bMin=255,bMax=0;
    for(const p of box.s){rMin=Math.min(rMin,p[0]);rMax=Math.max(rMax,p[0]);gMin=Math.min(gMin,p[1]);gMax=Math.max(gMax,p[1]);bMin=Math.min(bMin,p[2]);bMax=Math.max(bMax,p[2]);}
    const dr=rMax-rMin,dg=gMax-gMin,db=bMax-bMin;
    const ch=dr>=dg&&dr>=db?0:(dg>=db?1:2);
    box.s.sort((a,b)=>a[ch]-b[ch]);
    const mid=Math.floor(box.s.length/2);
    const s1=box.s.slice(0,mid),s2=box.s.slice(mid);
    boxes.splice(bi,1,{s:s1},{s:s2});
  }
  const pal=new Uint8Array(nColors*3);
  for(let i=0;i<boxes.length&&i<nColors;i++){
    let r=0,g=0,b=0;const s=boxes[i].s;
    for(const p of s){r+=p[0];g+=p[1];b+=p[2];}
    pal[i*3]=s.length?Math.round(r/s.length):0;
    pal[i*3+1]=s.length?Math.round(g/s.length):0;
    pal[i*3+2]=s.length?Math.round(b/s.length):0;
  }
  return pal;
}
function gifLZW(minCodeSize,pixels){
  const CLEAR=1<<minCodeSize,EOI=CLEAR+1;
  let codeSize=minCodeSize+1,next=CLEAR+2;
  const dict=new Map();
  let acc=0,nbits=0;
  const out=[];
  function emit(code){acc|=(code<<nbits);nbits+=codeSize;while(nbits>=8){out.push(acc&0xFF);acc>>=8;nbits-=8;}}
  emit(CLEAR);
  let prev=-1;
  for(let i=0;i<pixels.length;i++){
    const c=pixels[i];
    const key=(prev<<8)|c;
    if(prev===-1){prev=c;continue;}
    if(dict.has(key)){prev=dict.get(key);}
    else{
      emit(prev);
      if(next<4096){dict.set(key,next);next++;}
      if(next>=4096){emit(CLEAR);dict.clear();next=CLEAR+2;codeSize=minCodeSize+1;}
      else if(next>(1<<codeSize))codeSize++;
      prev=c;
    }
  }
  if(prev!==-1)emit(prev);
  emit(EOI);
  if(nbits>0)out.push(acc&0xFF);
  return new Uint8Array(out);
}
function gifAssemble(W,H,palette,indexFrames,delayCS){
  const parts=[];
  parts.push(new Uint8Array([0x47,0x49,0x46,0x38,0x39,0x61]));
  const lsd=new Uint8Array(7);
  lsd[0]=W&0xFF;lsd[1]=(W>>8)&0xFF;lsd[2]=H&0xFF;lsd[3]=(H>>8)&0xFF;
  lsd[4]=0xF7;lsd[5]=0;lsd[6]=0;
  parts.push(lsd);
  const gct=new Uint8Array(256*3);gct.set(palette.subarray(0,palette.length));
  parts.push(gct);
  parts.push(new Uint8Array([0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,0x00,0x00,0x00]));/* NETSCAPE2.0 loop-forever + terminator */
  for(const idx of indexFrames){
    parts.push(new Uint8Array([0x21,0xF9,0x04,0x04,delayCS&0xFF,(delayCS>>8)&0xFF,0,0]));
    parts.push(new Uint8Array([0x2C,0,0,0,0,W&0xFF,(W>>8)&0xFF,H&0xFF,(H>>8)&0xFF,0]));
    parts.push(new Uint8Array([8]));
    const lzw=gifLZW(8,idx);
    for(let i=0;i<lzw.length;i+=255){
      parts.push(new Uint8Array([Math.min(lzw.length-i,255)]));
      parts.push(lzw.subarray(i,i+255));
    }
    parts.push(new Uint8Array([0]));
  }
  parts.push(new Uint8Array([0x3B]));
  return new Blob(parts,{type:'image/gif'});
}
let gifBusy=false;
function tick(){return new Promise(r=>setTimeout(r,0));}
async function exportGIF(){
  if(gifBusy){toast('GIF still encoding…');return;}
  gifBusy=true;
  const savedSel=sel;
  try{
    sel=null;
    const b=contentBounds();const pad=70;
    const w=(b.maxX-b.minX)+pad*2,h=(b.maxY-b.minY)+pad*2;
    const cap=Math.min(w,h,1600);
    const fw=Math.round(w),fh=Math.round(h);
    const canvas=document.createElement('canvas');canvas.width=fw;canvas.height=fh;
    const ctx=canvas.getContext('2d');
    const frames=[];
    for(let i=0;i<GIF_FRAMES;i++){
      const t=i*0.08;
      const svgStr=buildDiagramSVG(t);
      const img=await svgToImage(svgStr);
      ctx.fillStyle='#0b1120';ctx.fillRect(0,0,fw,fh);
      ctx.drawImage(img,0,0);
      frames.push(ctx.getImageData(0,0,fw,fh));
      if(i%4===0)toast('GIF frame '+(i+1)+'/'+GIF_FRAMES);
      await tick();
    }
    const samples=[];
    for(const fi of [0,Math.floor(GIF_FRAMES/2)]){
      const d=frames[fi].data;
      for(let p=0;p<d.length;p+=4*28){samples.push([d[p],d[p+1],d[p+2]]);}
    }
    const pal=medianCut(samples,256);
    const palLookup=new Map();
    function nearest(r,g,b){
      const key=(r<<16)|(g<<8)|b;
      if(palLookup.has(key))return palLookup.get(key);
      let bi=0,bd=Infinity;
      for(let i=0;i<256;i++){
        const dr=r-pal[i*3],dg=g-pal[i*3+1],db=b-pal[i*3+2];
        const d=dr*dr+dg*dg+db*db;
        if(d<bd){bd=d;bi=i;}
      }
      palLookup.set(key,bi);return bi;
    }
    const indexFrames=[];
    for(const f of frames){
      const idx=new Uint8Array(fw*fh);
      const d=f.data;
      for(let p=0,i=0;p<d.length;p+=4,i++)idx[i]=nearest(d[p],d[p+1],d[p+2]);
      indexFrames.push(idx);
      await tick();
    }
    const blob=gifAssemble(fw,fh,pal,indexFrames,GIF_DELAY_CS);
    download('network-diagram.gif',blob);
    toast('GIF exported ('+GIF_FRAMES+' frames, 1.6s loop)');
  }catch(e){console.error('GIF export failed',e);toast('GIF export failed');}
  finally{sel=savedSel;renderAll();gifBusy=false;}
}

const REC_FORMATS=[
  {name:'VP9 WebM',av:['video/webm;codecs=vp9,opus'],v:['video/webm;codecs=vp9']},
  {name:'VP8 WebM',av:['video/webm;codecs=vp8,opus'],v:['video/webm;codecs=vp8']},
  {name:'H.264 MP4',av:['video/mp4;codecs=avc1,mp4a'],v:['video/mp4;codecs=avc1']},

function detectRecFormats(){
  if(typeof MediaRecorder==='undefined'||!navigator.mediaDevices)return[];
  return REC_FORMATS.filter(f=>[...f.av,...f.v].some(m=>{try{return MediaRecorder.isTypeSupported(m);}catch(e){return false;}}));
}

function buildLiveFrameSVG(cssW,cssH,physW,physH,t){
  const defs='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b4a68"/></marker><marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker></defs>';
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+physW+'" height="'+physH+'" viewBox="0 0 '+cssW+' '+cssH+'">'+
    defs+'<rect width="'+cssW+'" height="'+cssH+'" fill="#0b1120"/>'+
    '<g transform="translate('+view.x+','+view.y+') scale('+view.k+')">'+
    exportLayerMarkup(gZ,t)+exportLayerMarkup(gE,t)+exportLayerMarkup(gN,t)+'</g></svg>';

async function startRecording(audioMode,musicFile,fmt){
  if(recording){toast('Already recording');return;}
  const cssW=svg.clientWidth,cssH=svg.clientHeight;
  const dpr=Math.min(1.5,window.devicePixelRatio||1);
  const physW=Math.round(cssW*dpr),physH=Math.round(cssH*dpr);
  recCanvas=document.createElement('canvas');recCanvas.width=physW;recCanvas.height=physH;
  const ctx=recCanvas.getContext('2d');
  recStart=performance.now();
  let building=false,lastImg=null;
  recPump=setInterval(async()=>{
    if(building)return;building=true;
    try{
      const t=(performance.now()-recStart)/1000;
      const svgStr=buildLiveFrameSVG(cssW,cssH,physW,physH,t);
      const img=await svgToImage(svgStr);lastImg=img;
    }catch(e){/* keep lastImg */}
    building=false;
    if(lastImg){ctx.fillStyle='#0b1120';ctx.fillRect(0,0,physW,physH);ctx.drawImage(lastImg,0,0,physW,physH);}
  },33);
  const tracks=[];
  const vstream=recCanvas.captureStream(30);
  tracks.push(...vstream.getVideoTracks());
  let hasAudio=false;
  if(audioMode==='mic'){
    try{
      const ms=await navigator.mediaDevices.getUserMedia({audio:true});
      tracks.push(...ms.getAudioTracks());hasAudio=true;
    }catch(e){toast('Mic unavailable — video only');}
  }else if(audioMode==='music'&&musicFile){
    try{
      recActx=new(window.AudioContext||window.webkitAudioContext)();
      recAudioEl=new Audio();
      recMusicUrl=URL.createObjectURL(musicFile);
      recAudioEl.src=recMusicUrl;
      const src=recActx.createMediaElementSource(recAudioEl);
      const dest=recActx.createMediaStreamDestination();
      src.connect(dest);src.connect(recActx.destination);
      recAudioEl.play();
      tracks.push(...dest.stream.getAudioTracks());hasAudio=true;
    }catch(e){toast('Music file error — video only');}
  }
  recStream=new MediaStream(tracks);
  const mime=hasAudio?fmt.av[0]:fmt.v[0];
  try{recRecorder=new MediaRecorder(recStream,{mimeType:mime,videoBitsPerSecond:6e6});}
  catch(e){
    const alt=detectRecFormats().find(f=>[...f.v,...f.av].some(m=>{try{return MediaRecorder.isTypeSupported(m);}catch(_){return false;}}));
    if(!alt){toast('No supported format');clearInterval(recPump);return;}
    recRecorder=new MediaRecorder(recStream,{mimeType:alt.v[0],videoBitsPerSecond:6e6});
  }
  recChunks=[];
  recRecorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
  recRecorder.onstop=()=>{
    const type=recRecorder.mimeType||'video/webm';
    const ext=type.includes('mp4')?'mp4':'webm';
    const blob=new Blob(recChunks,{type});
    download('network-diagram.'+ext,blob);
    toast('Recording saved ('+ext+')');
  };
  recRecorder.start(250);
  recording=true;
  const btn=$('#recBtn');if(btn){btn.textContent='Stop';btn.classList.add('danger');}
  let secs=0;
  recTimer=setInterval(()=>{
    secs=Math.floor((performance.now()-recStart)/1000);
    const el=$('#recTimer');if(el)el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
  },1000);
}
function stopRecording(){
  if(!recording)return;
  try{recRecorder.stop();}catch(e){}
  clearInterval(recPump);clearInterval(recTimer);
  if(recStream)recStream.getTracks().forEach(t=>t.stop());
  if(recActx){try{recAudioEl.pause();}catch(e){}if(recMusicUrl)URL.revokeObjectURL(recMusicUrl);recActx.close();recActx=null;recAudioEl=null;recMusicUrl=null;}
  recording=false;
  const btn=$('#recBtn');if(btn){btn.textContent='Start recording';btn.classList.remove('danger');}
  const el=$('#recTimer');if(el)el.textContent='';
}

function boundsOf(ids){
  const ns=state.nodes.filter(n=>ids.includes(n.id));
  if(!ns.length)return null;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const n of ns){

function focusOnBounds(b,animate){

function applyStep(k,animate){
  const steps=jSteps();
  if(!present||!steps.length)return;
  const kc=clamp(k,0,steps.length-1);
  pjStep=kc;
  const everShown=new Set(),shownSoFar=new Set(),hl=new Set();
  for(const s of steps)for(const id of(s.show||[]))everShown.add(id);
  for(let i=0;i<=kc;i++)for(const id of(steps[i].show||[]))shownSoFar.add(id);
  for(const id of(steps[kc].highlight||[]))hl.add(id);
  for(const e of state.edges)if(hl.has(e.a)&&hl.has(e.b))hl.add(e.id);
  pjHidden=new Set([...everShown].filter(id=>!shownSoFar.has(id)));
  pjOn=hl;
  pjHasHL=hl.size>0;
  const step=steps[kc];
  renderAll();
  const cap=$('#pjCaption'),cnt=$('#pjCounter');
  if(cap)cap.textContent=step.note||'';
  if(cnt)cnt.textContent=(kc+1)+' / '+steps.length;

/* sneakernet footsteps */
const sneakLUT=new Map();
function ensureSneak(e){
  if(e.dash!=='sneakernet')return null;
  const aN=nodeById(e.a),bN=nodeById(e.b);
  if(!aN||!bN)return null;
  const key=e.a+'>'+e.b+'@'+Math.round(aN.x)+','+Math.round(aN.y)+':'+Math.round(bN.x)+','+Math.round(bN.y);
  if(sneakLUT.has(key))return sneakLUT.get(key);
  const p1=anchor(aN,bN),p2=anchor(bN,aN);
  const dx=p2.x-p1.x,dy=p2.y-p1.y;
  let c1,c2;
  if(Math.abs(dx)>=Math.abs(dy)){c1={x:p1.x+dx*0.4,y:p1.y};c2={x:p2.x-dx*0.4,y:p2.y};}
  else{c1={x:p1.x,y:p1.y+dy*0.4};c2={x:p2.x,y:p2.y-dy*0.4};}
  const pts=[];
  const N=24;
  let total=0,prev=null;
  for(let i=0;i<=N;i++){
    const t=i/N,mt=1-t;
    const x=p1.x*mt*mt*mt+3*c1.x*mt*mt*t+3*c2.x*mt*t*t+p2.x*t*t*t;
    const y=p1.y*mt*mt*mt+3*c1.y*mt*mt*t+3*c2.y*mt*t*t+p2.y*t*t*t;
    const pt={x,y};
    if(prev)total+=Math.hypot(pt.x-prev.x,pt.y-prev.y);
    pts.push({x:pt.x,y:pt.y,acc:total});
    prev=pt;
  }
  const entry={key,pts,total};
  if(sneakLUT.size>=400){
    const first=sneakLUT.keys().next().value;
    sneakLUT.delete(first);
  }
  sneakLUT.set(key,entry);
  return entry;
}
function buildFootsteps(e,g){
  const sk=ensureSneak(e);
  if(!sk||!sk.total)return;
  const K=clamp(Math.round(sk.total/46),3,14);
  const wrap=el('g',{class:'footwrap footsteps','data-key':sk.key});
  const color=e.color||'#94a3b8';
  for(let i=0;i<K;i++){
    for(const laneSign of[1,-1]){
      const f=el('g',{class:'footstep','data-lane':laneSign,'data-phase':i/K});
      f.appendChild(el('ellipse',{rx:5,ry:2.6,fill:color,'fill-opacity':.55}));
      wrap.appendChild(f);
    }
  }
  g.appendChild(wrap);
}
function sneakStep(now){
  document.querySelectorAll('.footsteps').forEach(w=>{
    const sk=sneakLUT.get(w.dataset.key);
    if(!sk)return;
    const phase=((now/1000)%SNEAK_LOOP)/SNEAK_LOOP;
    w.querySelectorAll('.footstep').forEach(f=>{
      const lane=+f.dataset.lane;
      const base=+f.dataset.phase;
      let t=base+phase*lane;
      t=((t%1)+1)%1;
      const target=sk.total*t;
      let i=1;
      while(i<sk.pts.length-1&&sk.pts[i].acc<target)i++;
      const p0=sk.pts[i-1],p1=sk.pts[i];
      const seg=p1.acc-p0.acc||1;
      const fT=(target-p0.acc)/seg;
      const x=p0.x+(p1.x-p0.x)*fT,y=p0.y+(p1.y-p0.y)*fT;
      const dx=p1.x-p0.x,dy=p1.y-p0.y;
      const ang=Math.atan2(dy,dx)*180/Math.PI;
      const px=-dy/(Math.hypot(dx,dy)||1),py=dx/(Math.hypot(dx,dy)||1);
      const off=SNEAK_LANE_SNAP*lane;
      f.setAttribute('transform','translate('+(x+px*off)+','+(y+py*off)+') rotate('+ang+')');
    });
  });
}

function parseRunningConfig(text){
  const devices=[],links=[],warnings=[];
  const hostnames=new Set();
  let cur=null,curIf=null;
  const MAX_LINES=50000;
  const lines=String(text||'').split(/\r?\n/);
  if(lines.length>MAX_LINES){warnings.push({reason:'line cap exceeded ('+lines.length+' > '+MAX_LINES+') — truncated'});}
  for(let i=0;i<Math.min(lines.length,MAX_LINES);i++){
    let ln=lines[i];
    const hash=ln.indexOf('#');
    if(hash>=0)ln=ln.slice(0,hash);
    ln=ln.trim();
    if(!ln)continue;
    if(ln.startsWith('hostname ')){
      const name=ln.slice(9).trim();
      if(cur&&cur.hostname===name)continue;
      cur={hostname:name,interfaces:[]};
      devices.push(cur);
      if(hostnames.has(name))warnings.push({device:name,reason:'duplicate hostname — last wins'});
      hostnames.add(name);
      curIf=null;

    }
    if(ln.startsWith('interface ')){
      if(!cur)continue;

      cur.interfaces.push(curIf);
      continue;
    }
    if(ln==='!'){curIf=null;continue;}
    if(curIf){
      if(ln.startsWith('description '))curIf.description=ln.slice(12).trim();
      else if(ln==='shutdown')curIf.shutdown=true;
      continue;
    }
    /* noise (router ospf, access-list, vlan, etc.) — skipped silently */
  }
  /* peer heuristic on descriptions */
  for(const d of devices){
    for(const itf of d.interfaces){
      if(!itf.description)continue;
      const norm=itf.description.toUpperCase().replace(/[_\s]+/g,' ').trim();
      const toks=norm.split(' ').filter(Boolean);
      let toks2=toks.slice();
      while(toks2.length&&['TO','LINK','UPLINK','P2P'].includes(toks2[0]))toks2.shift();

function mapAssetType(type){

function parseAssetsJSON(doc){
  const assets=[],warnings=[];
  let arr=doc;
  if(typeof doc==='string'){
    if(!doc.trim())return{assets:[],warnings:[]};
    if(doc.length>5*1024*1024)return{assets:[],warnings:[{reason:'input exceeds 5MB cap'}]};
    try{arr=JSON.parse(doc);}catch(e){return{assets:[],warnings:[{reason:'invalid JSON: '+e.message}]};}
  }
  if(!Array.isArray(arr))return{assets:[],warnings:[{reason:'expected a JSON array'}]};
  for(const o of arr){
    if(!o||typeof o!=='object')continue;
    /* proto-pollution guard */
    for(const bad of['__proto__','constructor'])if(bad in o){delete o[bad];warnings.push({reason:'dropped dangerous key '+bad});}
    const pick=(keys)=>{for(const k of keys){if(o[k]!=null&&String(o[k]).trim())return String(o[k]);}return'';};
    const name=pick(['name','hostname','asset_name']);
    const type=pick(['type','category','class']);
    const ip=pick(['ip','address','mgmt_ip']);
    const group=pick(['site','zone','branch','location','group']);
    if(!name){warnings.push({reason:'asset missing name — skipped'});continue;}
    assets.push({name,type,ip,group,mappedType:mapAssetType(type)});
  }
  return{assets,warnings};
}
function splitCSVLine(line){
  const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(inQ){
      if(ch==='"'){
        if(line[i+1]==='"'){cur+='"';i++;}
        else inQ=false;
      }else cur+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===','){out.push(cur);cur='';}
      else cur+=ch;
    }
  }
  out.push(cur);
  return out;
}
function parseAssetsCSV(text){
  const assets=[],warnings=[];
  if(!text||!text.trim())return{assets:[],warnings:[]};
  if(text.length>5*1024*1024)return{assets:[],warnings:[{reason:'input exceeds 5MB cap'}]};
  const lines=text.split(/\r?\n/);
  if(!lines.length)return{assets:[],warnings:[]};
  const header=splitCSVLine(lines[0]).map(h=>h.trim().toLowerCase());
  const idx=(keys)=>{for(const k of keys){const i=header.indexOf(k);if(i>=0)return i;}return-1;};
  const iName=idx(['name','hostname','asset_name']);
  const iType=idx(['type','category','class']);
  const iIp=idx(['ip','address','mgmt_ip']);
  const iGroup=idx(['site','zone','branch','location','group']);
  for(let r=1;r<lines.length;r++){
    if(!lines[r].trim())continue;
    const cells=splitCSVLine(lines[r]);
    const get=i=>i>=0&&i<cells.length?cells[i].trim():'';
    let name=get(iName),type=get(iType),ip=get(iIp),group=get(iGroup);

    };
    name=san(name);type=san(type);ip=san(ip);group=san(group);
    if(!name){warnings.push({reason:'row '+(r+1)+' missing name — skipped'});continue;}
    assets.push({name,type,ip,group,mappedType:mapAssetType(type)});
  }
  return{assets,warnings};
}
function buildIngestNodes(parsed,opts){
  opts=opts||{};
  const nodes=[],edges=[],zones=[];
  const zoneByLabel=new Map();
  let zn=0;
  const zoneFor=(label)=>{
    if(!label)return null;
    if(zoneByLabel.has(label))return zoneByLabel.get(label);
    const z={id:'iz'+(zn++),label,color:ZONE_COLORS[zn%ZONE_COLORS.length],x:0,y:0,w:0,h:0,kind:'zone',lanes:['Lane 1'],orient:'h'};
    zones.push(z);zoneByLabel.set(label,z);
    return z;
  };
  let nn=0;
  const addNode=(label,type,group)=>{
    const z=zoneFor(group);
    const perRow=4,spacing=200;
    const x=100+(nn%perRow)*spacing+ (z?0:0),y=100+Math.floor(nn/perRow)*spacing;
    const n={id:'in'+(nn++),label,type,x,y,color:SWATCHES[0],meta:{},fx:{}};
    if(z){n.x=z.x+40+((z.__count||0)%3)*160;n.y=z.y+50+Math.floor((z.__count||0)/3)*130;z.__count=(z.__count||0)+1;
      z.w=Math.max(z.w,n.x-z.x+140);z.h=Math.max(z.h,n.y-z.y+110);}

    return n;
  };
  if(parsed.devices){
    /* running-config: device nodes + link edges, no zones */
    const byHost=new Map();
    for(const d of parsed.devices){
      const n=addNode(d.hostname,guessDeviceType(d.hostname),null);

    }
    for(const l of parsed.links||[]){

      if(a&&b)edges.push({id:'ie'+edges.length,a:a.id,b:b.id,dash:'solid',mode:'curve',anim:false,label:''});
    }
  }else if(parsed.assets){
    for(const a of parsed.assets)addNode(a.name,a.mappedType,a.group);
  }
  for(const z of zones)delete z.__count;
  return{nodes,edges,zones};
}
function guessDeviceType(hostname){
  const h=String(hostname||'').toUpperCase();
  if(h.startsWith('FW')||h.includes('FIREWALL')||h.includes('ASA')||h.includes('PALO'))return'firewall';
  if(h.includes('SW')||h.includes('SWITCH'))return'switch';
  if(h.startsWith('R')||h.includes('ROUTER'))return'router';
  return'switch';
}

function applyIngest(parsed,mode){
  if(!parsed)return;
  const frag=buildIngestNodes(parsed);
  if(mode==='replace'){
    state.nodes=frag.nodes;state.edges=frag.edges;state.zones=frag.zones;
  }else{
    const norm=s=>String(s||'').trim().toLowerCase();
    const existing=new Set(state.nodes.map(n=>norm(n.label)));
    const offset=Math.max(state.nodes.length+state.edges.length+state.zones.length,100);
    const idMap=new Map();
    let k=offset;
    for(const n of frag.nodes){
      const nk=norm(n.label);
      if(existing.has(nk))continue;
      existing.add(nk);
      const id='mn'+(k++);
      idMap.set(n.id,id);
      state.nodes.push({...n,id,x:n.x+400,y:n.y+400});

}

function normalizeLines(text){
  const out=[];

  for(let line of raw){
    if(inBlock){
      const end=line.indexOf("'/");
      if(end>=0){inBlock=false;line=line.slice(end+2);}else continue;
    }
    const bs=line.indexOf("'/");
    if(bs>=0){
      const rest=line.slice(bs+2);
      const end=rest.indexOf("'/");
      if(end>=0)line=line.slice(0,bs)+rest.slice(end+2);
      else{line=line.slice(0,bs);inBlock=true;}
    }
    /* strip ' line comment: skip quotes — find ' outside double-quoted segments */
    let inQ=false,cut=-1;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){inQ=!inQ;continue;}
      if(ch==="'"&&!inQ&&/\s'/.test(line.slice(Math.max(0,i-1),i+1)||" '")){cut=i;break;}
      if(ch==="'"&&!inQ&&(i===0||/\s/.test(line[i-1]))){cut=i;break;}
    }
    if(cut>=0)line=line.slice(0,cut);
    line=line.trim();

      if(stack.length)stack.pop();

    if(/^end\s+(cloud|folder|rectangle|frame|node|stack|package)\s*$/i.test(line)){

      return;

    const z={label,alias:al,children:[],parentAlias:stack.length?stack[stack.length-1].alias:null,nodes:[]};

      const label=parts[0]||pumlStripCreole(rawDisplay);

      if(decl.stereotype)meta.stereotype=decl.stereotype;
      for(let pi=1;pi<parts.length;pi++){
        const kv=parts[pi].match(/^([^:]{1,20}):\s*(.+)$/);

      const n={alias,type,label,meta,zoneAlias:stack.length?stack[stack.length-1].alias:null};

  for(const e of edges){

    for(const n of nodes){
      if(pumlSanitizeAlias(n.label)===a)return n.alias;
      if(n.label===a)return n.alias;
    }
    return a;
  }
  return{zones,nodes,edges,warnings,ortho};
}
/* ===================== layered layout engine v3 (Sugiyama + zone bands) =====================
   Zones become strictly stacked horizontal bands ordered by inter-zone edge flow
   (topological zone ordering). Nested zones lay out side-by-side inside their parent.
   Nodes rank within their own zone; barycenter ordering minimizes crossings.
   Own implementation of published algorithms — MIT.
   ============================================================================================ */
const LAYER_GAP=140,X_GAP=44,LBL_PAD=34,ZPAD=26,ZGAP=70;
function layeredLayout(nodes,edges,opts){
  opts=opts||{};

  /* direct-zone membership + zone tree */
  const dZone=new Map();nodes.forEach(n=>dZone.set(n.alias,n.zoneAlias||null));
  const zones=opts.zones||[];
  const Z=new Map();zones.forEach(z=>Z.set(z.alias,z));
  /* unzoned pseudo-zone */
  const UNZ='@@unzoned';
  Z.set(UNZ,{alias:UNZ,nodes:[],parentAlias:null});
  zones.forEach(z=>{
    if(z.parentAlias&&Z.has(z.parentAlias)){/* ok */}
  });
  const kids=new Map();zones.forEach(z=>kids.set(z.alias,[]));
  const roots=[];
  zones.forEach(z=>{
    if(z.parentAlias&&Z.has(z.parentAlias))kids.get(z.parentAlias).push(z.alias);
    else roots.push(z.alias);
  });
