<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetDraw — Network Diagrams</title>
<style>
:root{
  --bg:#0b1120; --panel:#0f1626; --panel2:#131c30;
  --border:#1e2a44; --border2:#2a3a5c;
  --text:#e2e8f0; --muted:#8b9bb4; --faint:#5b6b85;
  --accent:#38bdf8; --card:#161f31;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:13px;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#topbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
#logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;
  letter-spacing:.2px;margin-right:6px}
#logo .sub{font-size:10.5px;font-weight:500;color:var(--faint);margin-left:2px;margin-top:3px}
.tgroup{display:flex;align-items:center;gap:3px;padding:3px;
  background:var(--panel2);border:1px solid var(--border);border-radius:10px}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
button{font-family:inherit;font-size:12.5px;color:var(--muted);background:transparent;
  border:none;border-radius:7px;height:30px;min-width:30px;padding:0 8px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;white-space:nowrap}
button:hover{background:#1b2740;color:var(--text)}
button:active{transform:translateY(.5px)}
button.active{background:#1d3a5c;color:var(--accent)}
button:disabled{opacity:.35;cursor:default;background:transparent;color:var(--muted)}
button svg{display:block;flex:0 0 auto}
#zoomPct{min-width:52px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn-text{font-weight:600}
#main{flex:1;display:flex;min-height:0;position:relative}
#palette{width:212px;flex:0 0 212px;background:var(--panel);
  border-right:1px solid var(--border);overflow-y:auto;padding:12px 10px 24px}
#palette::-webkit-scrollbar{width:8px}
#palette::-webkit-scrollbar-thumb{background:#22304e;border-radius:4px}
.pgroup{margin-bottom:14px}
.pgroup h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--faint);font-weight:700;padding:4px 6px 8px}
.pitems{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pitem{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:grab;transition:border-color .12s,background .12s}
.pitem:hover{border-color:var(--border2);background:#182338}
.pitem:active{cursor:grabbing}
.pitem .pic{width:34px;height:34px;border-radius:9px;display:flex;
  align-items:center;justify-content:center}
.pitem .pname{font-size:11px;color:var(--muted);font-weight:500}
#canvasWrap{flex:1;position:relative;min-width:0;background:var(--bg)}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#canvas.tool-select{cursor:default}
#canvas.tool-connect{cursor:crosshair}
#canvas.tool-zone{cursor:crosshair}
#canvas.tool-lane{cursor:crosshair}
#canvas.tool-pan{cursor:grab}
#canvas.panning{cursor:grabbing !important}
#canvas.tool-connect g.nodeg{cursor:crosshair}
g.zoneg{cursor:move}
g.nodeg{cursor:move}
.ports{opacity:0;transition:opacity .13s}
g.nodeg:hover .ports{opacity:1}
.port{cursor:crosshair}
.port:hover{stroke-width:2.5}
.edge{cursor:pointer}
.edge:hover .vis{stroke:#9db2d0}
.edge.sel .vis{stroke:#7dd3fc}
.vis.anim{animation:dashflow .8s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-28}}
#hintbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(15,22,38,.85);border:1px solid var(--border);border-radius:99px;
  padding:6px 16px;font-size:11px;color:var(--faint);pointer-events:none;white-space:nowrap}
#hintbar b{color:var(--muted);font-weight:600}
#props{position:absolute;top:12px;right:12px;width:224px;display:none;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#props h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--faint);font-weight:700;margin-bottom:9px}
#props label{display:block;font-size:10.5px;color:var(--faint);margin:9px 0 3px;
  text-transform:uppercase;letter-spacing:.8px}
#props input[type=text],#props select{width:100%;background:#0e1626;color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:7px 9px;
  font-size:12.5px;font-family:inherit;outline:none}
#props input:focus,#props select:focus{border-color:#2f6fa8}
#props .danger{width:100%;justify-content:center;background:#3a1622;color:#fda4af;
  border:1px solid #58202f;margin-top:10px}
#props .danger:hover{background:#4c1b2b}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:7px;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:10px;padding:3px 8px;border-radius:6px;background:var(--panel2);
  border:1px solid var(--border);color:var(--muted);cursor:pointer}
.chip.on{background:#1d3a5c;color:var(--accent);border-color:#2f6fa8}
#labelEditor{position:absolute;display:none;z-index:50;width:150px;text-align:center;
  background:#0c1322;border:1px solid var(--accent);color:var(--text);border-radius:7px;
  padding:5px 8px;font-size:12px;font-family:inherit;outline:none;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}
.overlay{position:fixed;inset:0;background:rgba(5,9,18,.72);display:none;
  align-items:center;justify-content:center;z-index:200}
.modal{width:min(440px,92vw);background:var(--panel);border:1px solid var(--border2);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px}
.mbody{padding:16px 20px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.primary{background:#1d3a5c;color:var(--accent);border:1px solid #2f6fa8}
.primary:hover{background:#234a75;color:var(--accent)}
#examplesMenu{position:absolute;top:52px;right:14px;display:none;z-index:100;
  background:var(--panel);border:1px solid var(--border2);border-radius:10px;
  box-shadow:0 14px 40px rgba(0,0,0,.5);padding:6px;min-width:180px}
#examplesMenu button{width:100%;justify-content:flex-start;padding:7px 12px}
#toast{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);
  background:rgba(15,22,38,.92);border:1px solid var(--border);border-radius:8px;
  padding:8px 16px;font-size:12px;color:var(--text);display:none;z-index:90;
  pointer-events:none;transition:opacity .3s}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/>
        <path d="M10.8 7.1 6.2 16.1M13.2 7.1l4.6 9M7.4 18h9.2"/>
      </svg>
      NetDraw <span class="sub">network diagrams</span>
    </div>
    <div class="tgroup" id="tools">
      <button data-tool="select" class="active" title="Select / Move (V)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 3l14 8.5-6.2 1.4L9.5 19z"/></svg></button>
      <button data-tool="connect" title="Connect (C)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5.5" cy="18.5" r="2.8"/><circle cx="18.5" cy="5.5" r="2.8"/><path d="M7.6 16.4 16.4 7.6"/></svg></button>
      <button data-tool="zone" title="Draw zone (Z)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="14" rx="3.5" stroke-dasharray="4.2 3.2"/></svg></button>
      <button data-tool="lane" title="Swimlanes (L)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M8 4v16"/></svg></button>
      <button data-tool="pan" title="Pan (H or Space)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10m0-5.5a1.5 1.5 0 0 1 3 0V10m0-4a1.5 1.5 0 0 1 3 0v5m0-2.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.8a6 6 0 0 1-4.9-2.6L4.6 15c-.9-1.3-.4-2.8 1-3.2.9-.2 1.8.2 2.3 1l.9 1.4"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="tgroup">
      <button id="btnZoomOut" title="Zoom out"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="zoomPct" title="Reset to 100%">100%</button>
      <button id="btnZoomIn" title="Zoom in"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="btnFit" title="Fit (F)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5 4 9.5 8.5 14"/><path d="M4 9.5h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="btnGrid" title="Toggle grid snap (G)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="1.2"/><circle cx="12" cy="6" r="1.2"/><circle cx="18" cy="6" r="1.2"/><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/><circle cx="6" cy="18" r="1.2"/><circle cx="12" cy="18" r="1.2"/><circle cx="18" cy="18" r="1.2"/></svg></button>
    </div>
    <div class="spacer"></div>
    <div class="tgroup">
      <button id="btnExamples" title="Examples"><span class="btn-text">Examples</span></button>
      <button id="btnSave" title="Save JSON (Ctrl+S)"><span class="btn-text">Save</span></button>
      <button id="btnOpen" title="Open JSON"><span class="btn-text">Open</span></button>
      <button id="btnPng" title="Export PNG"><span class="btn-text">PNG</span></button>
      <button id="btnClear" title="Clear"><span class="btn-text">Clear</span></button>
    </div>
  </div>
  <div id="main">
    <div id="palette"></div>
    <div id="canvasWrap">
      <svg id="canvas" class="tool-select" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b4a68"/></marker>
          <marker id="arrowSel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker>
          <pattern id="gridDot" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="1" fill="#1a2540"/></pattern>
        </defs>
        <rect id="gridRect" width="100%" height="100%" fill="url(#gridDot)" style="display:none"/>
        <g id="worldG"><g id="gZones"></g><g id="gEdges"></g><g id="gNodes"></g><g id="gTemp"></g><g id="gUI"></g></g>
      </svg>
      <div id="hintbar"><b>V</b> select · <b>C</b> connect · <b>Z</b> zone · <b>L</b> lanes · <b>H</b> pan · drag ports to link · <b>dbl-click</b> rename · <b>Del</b> delete · <b>G</b> grid · <b>F</b> fit</div>
      <div id="props">
        <h3 id="propsTitle">Properties</h3>
        <label>Label</label>
        <input id="pLabel" type="text" placeholder="label">
        <label>Color</label>
        <div id="pSwatches" class="swatches"></div>
        <div id="pEffects"></div>
        <div id="pEdgeOpts"></div>
        <div id="pLanes"></div>
        <button id="pDuplicate" title="Duplicate (node only)">Duplicate</button>
        <button class="danger" id="pDelete">Delete</button>
      </div>
      <input id="labelEditor" type="text" placeholder="label">
      <div id="examplesMenu"></div>
      <div id="toast"></div>
    </div>
  </div>
</div>
<div class="overlay" id="confirmOverlay"><div class="modal">
  <header>Clear canvas<button id="cfClose">✕</button></header>
  <div class="mbody">Remove all nodes, links and zones?<div class="mrow">
    <button id="cfCancel">Cancel</button><button class="primary" id="cfOk">Clear</button>
  </div></div>
</div></div>

  }

}
function renderAll(){

/* ===================== view transform ===================== */
function toWorld(cx,cy){const r=svg.getBoundingClientRect();return{x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k};}
function toScreen(wx,wy){const r=svg.getBoundingClientRect();return{x:wx*view.k+view.x+r.left,y:wy*view.k+view.y+r.top};}
function applyView(){
  svg.setAttribute('viewBox',`0 0 ${svg.clientWidth} ${svg.clientHeight}`);
  worldG.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);
  $('#zoomPct').textContent=Math.round(view.k*100)+'%';
  const gr=$('#gridRect');if(gr){gr.setAttribute('x',-view.x/view.k);gr.setAttribute('y',-view.y/view.k);gr.setAttribute('width',svg.clientWidth/view.k);gr.setAttribute('height',svg.clientHeight/view.k);}
}
window.addEventListener('resize',()=>{applyView();});
function zoomBy(cx,cy,f){
  const r=svg.getBoundingClientRect(),px=cx-r.left,py=cy-r.top;
  const k2=clamp(view.k*f,.2,4);
  view.x=px-(px-view.x)*k2/view.k;view.y=py-(py-view.y)*k2/view.k;view.k=k2;applyView();
}
function contentBounds(){
  const xs=state.nodes.map(n=>n.x).concat(state.zones.map(z=>z.x));
  const ys=state.nodes.map(n=>n.y).concat(state.zones.map(z=>z.y));
  const xe=state.nodes.map(n=>n.x+nodeW(n)).concat(state.zones.map(z=>z.x+z.w));
  const ye=state.nodes.map(n=>n.y+nodeH(n)).concat(state.zones.map(z=>z.y+z.h));
  return{minX:Math.min(...xs),minY:Math.min(...ys),maxX:Math.max(...xe),maxY:Math.max(...ye)};
}
function zoomFit(){
  if(!state.nodes.length&&!state.zones.length){tweenView(0,0,1);return;}
  const b=contentBounds();
  const minX=b.minX-40,minY=b.minY-40,maxX=b.maxX+40,maxY=b.maxY+40;
  const k=clamp(Math.min(svg.clientWidth/(maxX-minX),svg.clientHeight/(maxY-minY)),.2,1.5);
  tweenView(-minX*k+((svg.clientWidth-(maxX-minX)*k)/2),-minY*k+((svg.clientHeight-(maxY-minY)*k)/2),k);
}
function tweenView(tx,ty,tk,ms=300){
  if(tweenRAF)cancelAnimationFrame(tweenRAF);
  const sv={...view},t0=performance.now();
  const step=now=>{
    const t=clamp((now-t0)/ms,0,1);
    const e=t<.5?2*t*t:1-Math.pow(1-t,2);
    view.x=sv.x+(tx-sv.x)*e;view.y=sv.y+(ty-sv.y)*e;view.k=sv.k+(tk-sv.k)*e;
    applyView();
    if(t<1)tweenRAF=requestAnimationFrame(step);else tweenRAF=null;
  };
  tweenRAF=requestAnimationFrame(step);
}

  if(ev.code==='Space'){spaceHeld=true;ev.preventDefault();return;}
  if(ev.ctrlKey||ev.metaKey){
    const k=ev.key.toLowerCase();
    if(k==='z'&&!ev.shiftKey){ev.preventDefault();undo();return;}
    if(k==='y'||(k==='z'&&ev.shiftKey)){ev.preventDefault();redo();return;}
    if(k==='s'){ev.preventDefault();exportJSON();return;}
    if(k==='d'){ev.preventDefault();duplicateSelection();return;}
    return;
  }
  const k=ev.key.toLowerCase();
  if(k==='v')setTool('select');
  else if(k==='c')setTool('connect');
  else if(k==='z')setTool('zone');
  else if(k==='l')setTool('lane');
  else if(k==='h')setTool('pan');
  else if(k==='f')zoomFit();
  else if(k==='g')toggleGrid();
  else if(ev.key==='Delete'||ev.key==='Backspace')deleteSelection();
  else if(ev.key==='Escape'){sel=null;hideProps();hideEditor();renderAll();}
});

function download(name,blobOrText,type){
  const blob=typeof blobOrText==='string'?new Blob([blobOrText],{type:type||'application/json'}):blobOrText;
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.style.display='block';t.style.opacity=1;
  setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.style.display='none',300);},2200);
}
function exportJSON(){download('diagram.json',serialize());toast('Saved diagram.json');}
function importJSON(file){
  if(file.size>20*1024*1024){toast('File too large (max 20MB)');return;}
  const rd=new FileReader();
  rd.onload=()=>{
    let doc;
    try{doc=JSON.parse(rd.result);}catch(e){toast('Not valid JSON');return;}
    try{applyLoadedDoc(doc);zoomFit();toast('Loaded '+state.nodes.length+' nodes');}
    catch(e){toast('Not a valid diagram: '+e.message);}
  };
  rd.readAsText(file);
}
function applyLoadedDoc(doc){
  if(!doc||typeof doc!=='object')throw new Error('not an object');
  if(!Array.isArray(doc.nodes)||!Array.isArray(doc.edges)||!Array.isArray(doc.zones))throw new Error('missing nodes/edges/zones arrays');
  if(doc.nodes.length+doc.edges.length+doc.zones.length>20000)throw new Error('too many elements (max 20000)');

    id:String(n.id||''),type:TYPES[n.type]?n.type:'box',x:+n.x||0,y:+n.y||0,

/* GIF encoder */
function medianCut(samples,nColors){
  if(!samples.length)return new Uint8Array(nColors*3);
  const boxes=[{s:samples}];
  while(boxes.length<nColors){
    let bi=-1,br=-1;
    for(let i=0;i<boxes.length;i++){
      const s=boxes[i].s;if(s.length<2)continue;
      let rMin=255,rMax=0,gMin=255,gMax=0,bMin=255,bMax=0;
      for(let j=0;j<s.length;j++){const r=s[j*3],g=s[j*3+1],b=s[j*3+2];rMin=Math.min(rMin,r);rMax=Math.max(rMax,r);gMin=Math.min(gMin,g);gMax=Math.max(gMax,g);bMin=Math.min(bMin,b);bMax=Math.max(bMax,b);}
      const r=Math.max(rMax-rMin,gMax-gMin,bMax-bMin);
      if(r>br){br=r;bi=i;}
    }
    if(bi<0)break;
    const box=boxes[bi];
    let rMin=255,rMax=0,gMin=255,gMax=0,bMin=255,bMax=0;
    for(const p of box.s){rMin=Math.min(rMin,p[0]);rMax=Math.max(rMax,p[0]);gMin=Math.min(gMin,p[1]);gMax=Math.max(gMax,p[1]);bMin=Math.min(bMin,p[2]);bMax=Math.max(bMax,p[2]);}
    const dr=rMax-rMin,dg=gMax-gMin,db=bMax-bMin;
    const ch=dr>=dg&&dr>=db?0:(dg>=db?1:2);
    box.s.sort((a,b)=>a[ch]-b[ch]);
    const mid=Math.floor(box.s.length/2);
    const s1=box.s.slice(0,mid),s2=box.s.slice(mid);
    boxes.splice(bi,1,{s:s1},{s:s2});
  }
  const pal=new Uint8Array(nColors*3);
  for(let i=0;i<boxes.length&&i<nColors;i++){
    let r=0,g=0,b=0;const s=boxes[i].s;
    for(const p of s){r+=p[0];g+=p[1];b+=p[2];}
    pal[i*3]=s.length?Math.round(r/s.length):0;
    pal[i*3+1]=s.length?Math.round(g/s.length):0;
    pal[i*3+2]=s.length?Math.round(b/s.length):0;
  }
  return pal;
}
function gifLZW(minCodeSize,pixels){
  const CLEAR=1<<minCodeSize,EOI=CLEAR+1;
  let codeSize=minCodeSize+1,next=CLEAR+2;
  const dict=new Map();
  let acc=0,nbits=0;
  const out=[];
  function emit(code){acc|=(code<<nbits);nbits+=codeSize;while(nbits>=8){out.push(acc&0xFF);acc>>=8;nbits-=8;}}
  emit(CLEAR);
  let prev=-1;
  for(let i=0;i<pixels.length;i++){
    const c=pixels[i];
    const key=(prev<<8)|c;
    if(prev===-1){prev=c;continue;}
    if(dict.has(key)){prev=dict.get(key);}
    else{
      emit(prev);
      if(next<4096){dict.set(key,next);next++;}
      if(next>=4096){emit(CLEAR);dict.clear();next=CLEAR+2;codeSize=minCodeSize+1;}
      else if(next>(1<<codeSize))codeSize++;
      prev=c;
    }
  }
  if(prev!==-1)emit(prev);
  emit(EOI);
  if(nbits>0)out.push(acc&0xFF);
  return new Uint8Array(out);
}
function gifAssemble(W,H,palette,indexFrames,delayCS){
  const parts=[];
  parts.push(new Uint8Array([0x47,0x49,0x46,0x38,0x39,0x61]));
  const lsd=new Uint8Array(7);
  lsd[0]=W&0xFF;lsd[1]=(W>>8)&0xFF;lsd[2]=H&0xFF;lsd[3]=(H>>8)&0xFF;
  lsd[4]=0xF7;lsd[5]=0;lsd[6]=0;
  parts.push(lsd);
  const gct=new Uint8Array(256*3);gct.set(palette.subarray(0,palette.length));
  parts.push(gct);
  parts.push(new Uint8Array([0x21,0xFF,0x0B,0x4E,0x45,0x54,0x53,0x43,0x41,0x50,0x45,0x32,0x2E,0x30,0x03,0x01,0x00,0x00,0x00]));/* NETSCAPE2.0 loop-forever + terminator */
  for(const idx of indexFrames){
    parts.push(new Uint8Array([0x21,0xF9,0x04,0x04,delayCS&0xFF,(delayCS>>8)&0xFF,0,0]));
    parts.push(new Uint8Array([0x2C,0,0,0,0,W&0xFF,(W>>8)&0xFF,H&0xFF,(H>>8)&0xFF,0]));
    parts.push(new Uint8Array([8]));
    const lzw=gifLZW(8,idx);
    for(let i=0;i<lzw.length;i+=255){
      parts.push(new Uint8Array([Math.min(lzw.length-i,255)]));
      parts.push(lzw.subarray(i,i+255));
    }
    parts.push(new Uint8Array([0]));
  }
  parts.push(new Uint8Array([0x3B]));
  return new Blob(parts,{type:'image/gif'});
}
let gifBusy=false;
function tick(){return new Promise(r=>setTimeout(r,0));}
async function exportGIF(){
  if(gifBusy){toast('GIF still encoding…');return;}
  gifBusy=true;
  const savedSel=sel;
  try{
    sel=null;
    const b=contentBounds();const pad=70;
    const w=(b.maxX-b.minX)+pad*2,h=(b.maxY-b.minY)+pad*2;
    const cap=Math.min(w,h,1600);
    const fw=Math.round(w),fh=Math.round(h);
    const canvas=document.createElement('canvas');canvas.width=fw;canvas.height=fh;
    const ctx=canvas.getContext('2d');
    const frames=[];
    for(let i=0;i<GIF_FRAMES;i++){
      const t=i*0.08;
      const svgStr=buildDiagramSVG(t);
      const img=await svgToImage(svgStr);
      ctx.fillStyle='#0b1120';ctx.fillRect(0,0,fw,fh);
      ctx.drawImage(img,0,0);
      frames.push(ctx.getImageData(0,0,fw,fh));
      if(i%4===0)toast('GIF frame '+(i+1)+'/'+GIF_FRAMES);
      await tick();
    }
    const samples=[];
    for(const fi of [0,Math.floor(GIF_FRAMES/2)]){
      const d=frames[fi].data;
      for(let p=0;p<d.length;p+=4*28){samples.push([d[p],d[p+1],d[p+2]]);}
    }
    const pal=medianCut(samples,256);
    const palLookup=new Map();
    function nearest(r,g,b){
      const key=(r<<16)|(g<<8)|b;
      if(palLookup.has(key))return palLookup.get(key);
      let bi=0,bd=Infinity;
      for(let i=0;i<256;i++){
        const dr=r-pal[i*3],dg=g-pal[i*3+1],db=b-pal[i*3+2];
        const d=dr*dr+dg*dg+db*db;
        if(d<bd){bd=d;bi=i;}
      }
      palLookup.set(key,bi);return bi;
    }
    const indexFrames=[];
    for(const f of frames){
      const idx=new Uint8Array(fw*fh);
      const d=f.data;
      for(let p=0,i=0;p<d.length;p+=4,i++)idx[i]=nearest(d[p],d[p+1],d[p+2]);
      indexFrames.push(idx);
      await tick();
    }
    const blob=gifAssemble(fw,fh,pal,indexFrames,GIF_DELAY_CS);
    download('network-diagram.gif',blob);
    toast('GIF exported ('+GIF_FRAMES+' frames, 1.6s loop)');
  }catch(e){console.error('GIF export failed',e);toast('GIF export failed');}
  finally{sel=savedSel;renderAll();gifBusy=false;}
}

  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+physW+'" height="'+physH+'" viewBox="0 0 '+cssW+' '+cssH+'">'+
    defs+'<rect width="'+cssW+'" height="'+cssH+'" fill="#0b1120"/>'+
    '<g transform="translate('+view.x+','+view.y+') scale('+view.k+')">'+
    cloneLayerMarkup(gZ,t)+cloneLayerMarkup(gE,t)+cloneLayerMarkup(gN,t)+'</g></svg>';
}
async function startRecording(audioMode,musicFile,fmt){
  if(recording){toast('Already recording');return;}
  const cssW=svg.clientWidth,cssH=svg.clientHeight;
  const dpr=Math.min(1.5,window.devicePixelRatio||1);
  const physW=Math.round(cssW*dpr),physH=Math.round(cssH*dpr);
  recCanvas=document.createElement('canvas');recCanvas.width=physW;recCanvas.height=physH;
  const ctx=recCanvas.getContext('2d');
  recStart=performance.now();
  let building=false,lastImg=null;
  recPump=setInterval(async()=>{
    if(building)return;building=true;
    try{
      const t=(performance.now()-recStart)/1000;
      const svgStr=buildLiveFrameSVG(cssW,cssH,physW,physH,t);
      const img=await svgToImage(svgStr);lastImg=img;
    }catch(e){/* keep lastImg */}
    building=false;
    if(lastImg){ctx.fillStyle='#0b1120';ctx.fillRect(0,0,physW,physH);ctx.drawImage(lastImg,0,0,physW,physH);}
  },33);
  const tracks=[];
  const vstream=recCanvas.captureStream(30);
  tracks.push(...vstream.getVideoTracks());
  let hasAudio=false;
  if(audioMode==='mic'){
    try{
      const ms=await navigator.mediaDevices.getUserMedia({audio:true});
      tracks.push(...ms.getAudioTracks());hasAudio=true;
    }catch(e){toast('Mic unavailable — video only');}
  }else if(audioMode==='music'&&musicFile){
    try{
      recActx=new(window.AudioContext||window.webkitAudioContext)();
      recAudioEl=new Audio();
      recMusicUrl=URL.createObjectURL(musicFile);
      recAudioEl.src=recMusicUrl;
      const src=recActx.createMediaElementSource(recAudioEl);
      const dest=recActx.createMediaStreamDestination();
      src.connect(dest);src.connect(recActx.destination);
      recAudioEl.play();
      tracks.push(...dest.stream.getAudioTracks());hasAudio=true;
    }catch(e){toast('Music file error — video only');}
  }
  recStream=new MediaStream(tracks);
  const mime=hasAudio?fmt.av[0]:fmt.v[0];
  try{recRecorder=new MediaRecorder(recStream,{mimeType:mime,videoBitsPerSecond:6e6});}
  catch(e){
    const alt=detectRecFormats().find(f=>[...f.v,...f.av].some(m=>{try{return MediaRecorder.isTypeSupported(m);}catch(_){return false;}}));
    if(!alt){toast('No supported format');clearInterval(recPump);return;}
    recRecorder=new MediaRecorder(recStream,{mimeType:alt.v[0],videoBitsPerSecond:6e6});
  }
  recChunks=[];
  recRecorder.ondataavailable=e=>{if(e.data.size)recChunks.push(e.data);};
  recRecorder.onstop=()=>{
    const type=recRecorder.mimeType||'video/webm';
    const ext=type.includes('mp4')?'mp4':'webm';
    const blob=new Blob(recChunks,{type});
    download('network-diagram.'+ext,blob);
    toast('Recording saved ('+ext+')');
  };
  recRecorder.start(250);
  recording=true;
  const btn=$('#recBtn');if(btn){btn.textContent='Stop';btn.classList.add('danger');}
  let secs=0;
  recTimer=setInterval(()=>{
    secs=Math.floor((performance.now()-recStart)/1000);
    const el=$('#recTimer');if(el)el.textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
  },1000);
}
function stopRecording(){
  if(!recording)return;
  try{recRecorder.stop();}catch(e){}
  clearInterval(recPump);clearInterval(recTimer);
  if(recStream)recStream.getTracks().forEach(t=>t.stop());
  if(recActx){try{recAudioEl.pause();}catch(e){}if(recMusicUrl)URL.revokeObjectURL(recMusicUrl);recActx.close();recActx=null;recAudioEl=null;recMusicUrl=null;}
  recording=false;
  const btn=$('#recBtn');if(btn){btn.textContent='Start recording';btn.classList.remove('danger');}
  const el=$('#recTimer');if(el)el.textContent='';
}
</script>
