  const fwdEdge=e=>{
    if(e.dir==='up'||e.dir==='left')return{a:e.b,b:e.a};
    return{a:e.a,b:e.b};
  };
  /* ---- 1. zone ordering: longest-path topo sort on inter-zone edge graph ---- */

  zones.forEach(z=>{zAdj.set(z.alias,[]);zRad.set(z.alias,[]);});

    members.forEach(m=>{if(!seen.has(m)){let mx=-1;rad.get(m).forEach(p=>{mx=Math.max(mx,rank.get(p)||0);});rank.set(m,mx+1);}});

      if(mset.has(a)&&mset.has(b))local.push({a,b});
    }

    const up=new Map(),dn=new Map();
    members.forEach(m=>{up.set(m,[]);dn.set(m,[]);});
    local.forEach(({a,b})=>{const ra=rank.get(a)||0,rb=rank.get(b)||0;if(rb>ra){dn.get(a).push(b);up.get(b).push(a);}});

    const recompute=()=>{ranks.forEach(r=>order.get(r).forEach((al,c)=>posOf.set(al,{row:r,col:c})));};
    recompute();

        const rowsInRank=Math.ceil(arr.length/cols);

      });

        const cx0=x+ZPAD+(maxW-rowW.get(r))/2;
        arr.forEach((al,j)=>{
          const col=j%cols, row=Math.floor(j/cols);
          positions.set(al,{x:cx0+col*(NW+X_GAP),y:yCursor+row*(NH+LAYER_GAP)});
        });
        const rowsInRank=Math.ceil(arr.length/cols);
        yCursor+=rowsInRank*(NH+LAYER_GAP);
      });
      const mH=yCursor-(y+ZPAD+LBL_PAD);
      /* children row below direct members, horizontally */
      let cy=y+ZPAD+LBL_PAD+mH+(children.length?ZGAP/2:0);
      let cx2=x+ZPAD;
      let maxChH=0;
      const childRects=[];
      for(const cA of children){
        const cw=measureZone(cA);
        layoutZoneBand(cA,cx2,cy);
        const crect=zoneRects.get(cA);
        childRects.push(crect);
        maxChH=Math.max(maxChH,crect.h);
        cx2+=crect.w+ZGAP;
      }
      innerW=Math.max(maxW,(childRects.length?childRects[childRects.length-1].x+childRects[childRects.length-1].w-x-ZPAD:maxW));
      innerH=mH+(children.length?ZGAP/2+maxChH:0);

    }
    /* no direct members: just children side-by-side */
    let cx2=x+ZPAD,cy=y+ZPAD+LBL_PAD,maxChH=0;
    const childRects=[];
    for(const cA of children){
      layoutZoneBand(cA,cx2,cy);
      const crect=zoneRects.get(cA);
      childRects.push(crect);
      maxChH=Math.max(maxChH,crect.h);
      cx2+=crect.w+ZGAP;
    }
    const w=(childRects.length?childRects[childRects.length-1].x+childRects[childRects.length-1].w-x:0)+ZPAD;
    const h=LBL_PAD+maxChH+ZPAD*2;
    zoneRects.set(zA,{x,y,w:Math.max(w,140),h:Math.max(h,80)});

  }
  /* measure zone width without placing (for the children-row width calc) — cheap: layout into throwaway, then re-layout properly.

  function measureZone(zA){
    const z=Z.get(zA);
    const members=z.nodes||[];
    const children=kids.get(zA)||[];
    const MAX_COLS=8;
    let w=0;
    if(members.length){
      const{ranks,order}=orderGroup(members);
      const rowW=new Map();
      ranks.forEach(r=>{const arr=order.get(r);const cols=Math.min(arr.length,MAX_COLS);rowW.set(r,cols*(NW+X_GAP)-X_GAP);});
      w=Math.max(...ranks.map(r=>rowW.get(r)),NW)+ZPAD*2;
    }
    let cw=0;
    for(const cA of children){cw+=measureZone(cA)+ZGAP;}
    if(cw)cw-=ZGAP;
    return Math.max(w,cw);

  let by=0,maxW=0;
  const placed=[];
  for(const rA of orderedRoots){
    const w=measureZone(rA);
    placed.push({rA,w});
    maxW=Math.max(maxW,w);
  }
  /* unzoned pseudo-band measure */
  const unzNodes=nodes.filter(n=>!dZone.get(n.alias));
  let unzH=0,unzW=0;
  if(unzNodes.length){
    const aliases=unzNodes.map(n=>n.alias);
    const{ranks,order}=orderGroup(aliases);
    const rowW=new Map();
    ranks.forEach(r=>{const arr=order.get(r);rowW.set(r,arr.reduce((s,al)=>s+(N.get(al).w||NW)+X_GAP,0)-X_GAP);});
    unzW=Math.max(...ranks.map(r=>rowW.get(r)),NW);
    unzH=ranks.length*(NH+LAYER_GAP);
  }
  const unzLvl=lvlOf(UNZ);
  let unzPlaced=false;
  let yy=0;
  for(const{rA,w}of placed){
    /* insert unzoned band at its level */

      layoutUnzoned((maxW-unzW)/2,yy);yy+=unzH+ZGAP;unzPlaced=true;
    }
    layoutZoneBand(rA,(maxW-w)/2,yy);
    yy+=zoneRects.get(rA).h+ZGAP;
  }
  if(!unzPlaced&&unzNodes.length){layoutUnzoned((maxW-unzW)/2,yy);}
  function layoutUnzoned(x,y){
    const aliases=unzNodes.map(n=>n.alias);
    const{ranks,order}=orderGroup(aliases);
    const rowW=new Map();
    ranks.forEach(r=>{const arr=order.get(r);rowW.set(r,arr.reduce((s,al)=>s+(N.get(al).w||NW)+X_GAP,0)-X_GAP);});
    const mw=Math.max(...ranks.map(r=>rowW.get(r)),NW);
    ranks.forEach((r,ri)=>{
      let cx=(mw-rowW.get(r))/2;
      order.get(r).forEach(al=>{
        positions.set(al,{x:x+cx,y:y+ri*(NH+LAYER_GAP)});
        cx+=(N.get(al).w||NW)+X_GAP;
      });
    });
  }
  return{positions,zoneRects};
}
function pumlLayout(parsed){
  const NWL=NW+20,NHL=NH+20,ZONE_GAP=60,PAD=24,LABEL=30;
  const nodes=[],edges=[],zones=[];
  const idBase=Math.max(state.nodes.length+state.edges.length+state.zones.length,1000);
  let idn=idBase;
  const aliasToId=new Map();
  const aliasToIdx=new Map();
  for(let i=0;i<parsed.nodes.length;i++){
    const id='n'+(idn++);
    aliasToId.set(parsed.nodes[i].alias,id);
    aliasToIdx.set(parsed.nodes[i].alias,i);
    nodes.push({id,type:parsed.nodes[i].type,x:0,y:0,label:parsed.nodes[i].label,color:SWATCHES[0],meta:parsed.nodes[i].meta||{},fx:{}});
  }
  let idz=idBase;
  const zoneIdByAlias=new Map();
  for(const z of parsed.zones){
    const id='z'+(idz++);
    zoneIdByAlias.set(z.alias,id);
    zones.push({id,x:0,y:0,w:0,h:0,label:z.label,color:ZONE_COLORS[(idz-idBase-1)%ZONE_COLORS.length],kind:'zone',lanes:['Lane 1'],orient:'h',nodeIds:[]});
  }
  /* containment: node → outermost zone (v1 flattens nesting) */
  const nodeZone=new Map();
  for(const n of parsed.nodes){
    let z=null;
    if(n.zoneAlias){
      z=parsed.zones.find(zz=>zz.alias===n.zoneAlias);
      while(z&&z.parentAlias){
        const p=parsed.zones.find(zz=>zz.alias===z.parentAlias);
        if(!p)break;
        z=p;
      }
    }
    if(z)nodeZone.set(n.alias,z.alias);
  }
  /* zone → its nodes (flattened) */
  const zoneMembers=new Map();
  for(const z of parsed.zones)zoneMembers.set(z.alias,[]);
  for(const n of parsed.nodes){
    const za=nodeZone.get(n.alias);
    if(za&&zoneMembers.has(za))zoneMembers.get(za).push(n.alias);
  }
  /* ---- layered layout (Sugiyama): ranks follow edge direction, zones stacked vertically ---- */
  const lay=layeredLayout(
    parsed.nodes.map(n=>({alias:n.alias,label:n.label,w:NW,h:NH,zoneAlias:n.zoneAlias||null})),
    parsed.edges.map(e=>({a:e.a,b:e.b,dir:e.dir||null})),
    {zones:parsed.zones.map(z=>({alias:z.alias,nodes:z.nodes,parentAlias:z.parentAlias||null}))}
  );
  /* place nodes using layered positions, with a global offset */
  const OFF=120;
  for(const n of parsed.nodes){
    const p=lay.positions.get(n.alias);
    const idx=aliasToIdx.get(n.alias);
    if(p&&idx!=null){nodes[idx].x=OFF+p.x;nodes[idx].y=OFF+p.y;}
  }
  /* zone rects from layered engine, padded */
  for(const z of parsed.zones){
    const r=lay.zoneRects.get(z.alias);
    const zid=zoneIdByAlias.get(z.alias);
    const zobj=zones.find(zz=>zz.id===zid);
    if(r&&zobj){
      zobj.x=OFF+r.x-PAD;zobj.y=OFF+r.y-PAD-LABEL;
      zobj.w=r.w+PAD*2;zobj.h=r.h+PAD*2+LABEL;
    }
  }
  /* edges: map aliases → ids, orthogonal when linetype ortho, animated when direction hints exist */
  let ide=idBase;
  for(const e of parsed.edges){
    const aId=aliasToId.get(e.a),bId=aliasToId.get(e.b);
    if(!aId||!bId)continue;
    edges.push({id:'e'+(ide++),a:aId,b:bId,dash:e.style==='dashed'?'dashed':'solid',mode:parsed.ortho?'ortho':'straight',anim:!!e.dir,label:e.label||''});
  }
  for(const z of zones)delete z.nodeIds;
  return{nodes,edges,zones};
}
function doPumlImport(text){
  const parsed=pumlParse(text);
  if(parsed.warnings.length){
    toast(parsed.warnings.length+' warning(s) — see console');
    console.warn('puml warnings:',parsed.warnings);
  }
  const frag=pumlLayout(parsed);
  state.nodes=frag.nodes;state.edges=frag.edges;state.zones=frag.zones;
  sel=null;hideProps();
  restoreIds();
  commit();renderAll();zoomFit();
  toast('Imported '+frag.nodes.length+' nodes, '+frag.edges.length+' links, '+frag.zones.length+' zones');
}
function openPumlModal(){
  /* Collapsible PUML panel docked on the right side of #main */
  let panel=$('#pumlPanel');
  if(!panel){
    panel=document.createElement('div');
    panel.id='pumlPanel';
    panel.style.cssText='width:0;flex:0 0 auto;overflow:hidden;background:var(--panel);border-left:1px solid var(--border);transition:width .2s ease;display:flex;flex-direction:column;min-width:0';
    panel.innerHTML=
      '<div style="padding:8px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex:0 0 auto">'+
      '<span style="font-weight:700;font-size:12px;white-space:nowrap">PlantUML</span>'+
      '<span style="font-size:9px;color:var(--muted);white-space:nowrap">live sync</span>'+
      '<button id="pumlClose" style="margin-left:auto;min-width:22px;height:22px;font-size:11px">✕</button>'+
      '</div>'+
      '<div style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0">'+
      '<textarea id="pumlPaste" spellcheck="false" wrap="off" placeholder="@startuml\npackage DMZ {\n  component \"Web\" as web\n}\nweb --> db : reads\n@enduml" style="flex:1;width:100%;box-sizing:border-box;background:#0e1626;color:var(--text);border:none;border-bottom:1px solid var(--border);padding:8px 10px;font-family:ui-monospace,Consolas,monospace;font-size:11px;line-height:1.5;outline:none;resize:none;tab-size:2;white-space:pre;overflow:auto"></textarea>'+
      '<div id="pumlStatus" style="font-size:10px;color:var(--muted);padding:3px 10px;min-height:16px;flex:0 0 auto;background:#0b1120"></div>'+
      '<div style="display:flex;gap:4px;padding:6px 10px;border-top:1px solid var(--border);flex:0 0 auto">'+
      '<input id="pumlFile" type="file" accept=".puml,text/plain" style="flex:1;font-size:10px;color:var(--muted);min-width:0">'+
      '<button id="pumlCopyBtn" style="font-size:10px;min-width:48px">Copy</button>'+
      '<button id="pumlDownloadBtn" style="font-size:10px;min-width:64px">Download</button>'+
      '</div></div>';
    const main=$('#main');
    main.appendChild(panel);

    let syncTimer=null,applying=false,open=false;
    const ta=$('#pumlPaste'),statusEl=$('#pumlStatus');

    function liveImport(){
      const txt=ta.value;
      if(!txt.trim()){statusEl.textContent='';return;}
      applying=true;
      try{
        doPumlImport(txt);
        const p=pumlParse(txt);
        const warns=p.warnings.filter(w=>!w.includes('BackgroundColor')&&!w.includes('BorderColor')&&!w.includes('skinparam node')&&!w.includes('BorderColor')&&!w.includes('top to bottom'));
        statusEl.textContent=p.nodes.length+' nodes · '+p.edges.length+' edges · '+p.zones.length+' zones'+(warns.length?' · '+warns.length+' warnings':'');
        statusEl.style.color=warns.length?'#fbbf24':'var(--muted)';
      }catch(e){statusEl.textContent='Parse error: '+e.message;statusEl.style.color='#f87171';}
      finally{applying=false;}
    }
    ta.oninput=()=>{
      if(applying)return;
      clearTimeout(syncTimer);
      syncTimer=setTimeout(liveImport,400);
      statusEl.textContent='editing...';
      statusEl.style.color='var(--muted)';
    };

    function liveExport(){
      if(applying)return;
      const text=pumlSerialize(state);
      if(text!==ta.value){
        const pos=ta.selectionStart,scroll=ta.scrollTop;
        ta.value=text;
        ta.selectionStart=ta.selectionEnd=Math.min(pos,text.length);
        ta.scrollTop=scroll;
      }
    }

    /* hook commit so canvas edits update the textarea */
    const origCommit=commit;
    commit=function(){origCommit();if(open)liveExport();};

    $('#pumlFile').onchange=ev=>{
      const f=ev.target.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{ta.value=rd.result;liveImport();};
      rd.readAsText(f);
    };
    $('#pumlCopyBtn').onclick=()=>{
      navigator.clipboard.writeText(ta.value).then(()=>{statusEl.textContent='Copied to clipboard';statusEl.style.color='#34d399';});
    };
    $('#pumlDownloadBtn').onclick=()=>{exportPuml();};
    $('#pumlClose').onclick=()=>{panel.style.width='0';open=false;$('#btnPuml').classList.remove('active');};

    /* expose toggle for the button */
    panel._toggle=()=>{
      if(open){panel.style.width='0';open=false;$('#btnPuml').classList.remove('active');}
      else{
        panel.style.width='380px';
        open=true;
        $('#btnPuml').classList.add('active');
        ta.value=pumlSerialize(state);
        liveImport();
        setTimeout(()=>ta.focus(),250);
      }
    };
  }
  panel._toggle();
}
function pumlSerialize(st){
  const L=[];
  L.push('@startuml');
  function nodeLabel(n){
    let lbl=String(n.label).replace(/"/g,'\\"');
    const details=Object.entries(n.meta||{}).filter(([k,v])=>v&&!HIDDEN_META_KEYS.has(k));
    if(details.length)lbl+='\\n'+details.map(([k,v])=>k+': '+v).join('\\n');
    return lbl;
  }
  const seen=new Set();
  for(const z of st.zones){
    const za=pumlSanitizeAlias('z_'+z.id);
    L.push('package "'+String(z.label).replace(/"/g,'\\"')+'" as '+za+' {');
    for(const n of st.nodes){
      if(seen.has(n.id))continue;
      if(!inZone(n.x,n.y,z))continue;
      seen.add(n.id);
      const inv=Object.entries(PUML_STEREOTYPE_MAP).find(([k,v])=>v===n.type);
      L.push('  component "'+nodeLabel(n)+'" as '+pumlSanitizeAlias(n.id)+(inv?' <<'+inv[0]+'>>':''));
    }
    L.push('}');
  }
  for(const n of st.nodes){
    if(seen.has(n.id))continue;
    const inv=Object.entries(PUML_STEREOTYPE_MAP).find(([k,v])=>v===n.type);
    L.push('component "'+nodeLabel(n)+'" as '+pumlSanitizeAlias(n.id)+(inv?' <<'+inv[0]+'>>':''));
  }
  for(const e of st.edges){
    const from=pumlSanitizeAlias(e.a),to=pumlSanitizeAlias(e.b);
    const lab=e.label?': '+String(e.label).replace(/"/g,'\\"'):'';
    if(e.dash==='dashed')L.push(from+' ..> '+to+(lab?' '+lab:''));
    else L.push(from+' --> '+to+(lab?' '+lab:''));
  }
  L.push('@enduml');
  return L.join('\n');
}
function exportPuml(){
  const text=pumlSerialize(state);
  download('diagram.puml',new Blob([text],{type:'text/plain;charset=utf-8'}));
  toast('PlantUML exported');
}
function pumlRoundTrip(text){
  const m1=pumlParse(text);
  const frag1=pumlLayout(m1);
  const out=pumlSerialize({nodes:frag1.nodes,edges:frag1.edges,zones:frag1.zones});
  const m2=pumlParse(out);
  const labelsMatch=(a,b)=>a.length===b.length&&a.every(l=>b.includes(l));
  return{m1,m2,out,pass:m2.nodes.length===m1.nodes.length&&m2.edges.length===m1.edges.length&&m2.zones.length===m1.zones.length&&labelsMatch(m2.nodes.map(n=>n.label),m1.nodes.map(n=>n.label))};
}
