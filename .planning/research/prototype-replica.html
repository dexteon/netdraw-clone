<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetDraw — Network Diagrams (replica)</title>
<style>
:root{
  --bg:#0b1120; --panel:#0f1626; --panel2:#131c30;
  --border:#1e2a44; --border2:#2a3a5c;
  --text:#e2e8f0; --muted:#8b9bb4; --faint:#5b6b85;
  --accent:#38bdf8; --card:#161f31;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);
  font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:13px;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#topbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
#logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;
  letter-spacing:.2px;margin-right:6px}
#logo .sub{font-size:10.5px;font-weight:500;color:var(--faint);margin-left:2px;margin-top:3px}
.tgroup{display:flex;align-items:center;gap:3px;padding:3px;
  background:var(--panel2);border:1px solid var(--border);border-radius:10px}
.sep{width:1px;height:24px;background:var(--border);margin:0 4px}
button{font-family:inherit;font-size:12.5px;color:var(--muted);background:transparent;
  border:none;border-radius:7px;height:30px;min-width:30px;padding:0 8px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;white-space:nowrap}
button:hover{background:#1b2740;color:var(--text)}
button:active{transform:translateY(.5px)}
button.active{background:#1d3a5c;color:var(--accent)}
button:disabled{opacity:.35;cursor:default;background:transparent;color:var(--muted)}
button svg{display:block;flex:0 0 auto}
#zoomPct{min-width:52px;font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn-text{font-weight:600}

/* ---------- main / palette ---------- */
#main{flex:1;display:flex;min-height:0;position:relative}
#palette{width:212px;flex:0 0 212px;background:var(--panel);
  border-right:1px solid var(--border);overflow-y:auto;padding:12px 10px 24px}
#palette::-webkit-scrollbar{width:8px}
#palette::-webkit-scrollbar-thumb{background:#22304e;border-radius:4px}
.pgroup{margin-bottom:14px}
.pgroup h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--faint);font-weight:700;padding:4px 6px 8px}
.pitems{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pitem{background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;
  cursor:grab;transition:border-color .12s,background .12s}
.pitem:hover{border-color:var(--border2);background:#182338}
.pitem:active{cursor:grabbing}
.pitem .pic{width:34px;height:34px;border-radius:9px;display:flex;
  align-items:center;justify-content:center}
.pitem .pname{font-size:11px;color:var(--muted);font-weight:500}

/* ---------- canvas ---------- */
#canvasWrap{flex:1;position:relative;min-width:0;background:var(--bg)}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none}
#canvas.tool-select{cursor:default}
#canvas.tool-connect{cursor:crosshair}
#canvas.tool-zone{cursor:crosshair}
#canvas.tool-pan{cursor:grab}
#canvas.panning{cursor:grabbing !important}
#canvas.tool-connect g.nodeg{cursor:crosshair}
g.zoneg{cursor:move}
g.nodeg{cursor:move}
.ports{opacity:0;transition:opacity .13s}
g.nodeg:hover .ports{opacity:1}
.port{cursor:crosshair}
.port:hover{stroke-width:2.5}
.edge{cursor:pointer}
.edge:hover .vis{stroke:#9db2d0}
.edge.sel .vis{stroke:#7dd3fc}
.vis.anim{animation:dashflow .8s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-28}}

/* ---------- hint bar ---------- */
#hintbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
  background:rgba(15,22,38,.85);border:1px solid var(--border);border-radius:99px;
  padding:6px 16px;font-size:11px;color:var(--faint);pointer-events:none;white-space:nowrap}
#hintbar b{color:var(--muted);font-weight:600}

/* ---------- props panel ---------- */
#props{position:absolute;top:12px;right:12px;width:224px;display:none;
  background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:12px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#props h3{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;
  color:var(--faint);font-weight:700;margin-bottom:9px}
#props label{display:block;font-size:10.5px;color:var(--faint);margin:9px 0 3px;
  text-transform:uppercase;letter-spacing:.8px}
#props input[type=text],#props select{width:100%;background:#0e1626;color:var(--text);
  border:1px solid var(--border);border-radius:8px;padding:7px 9px;
  font-size:12.5px;font-family:inherit;outline:none}
#props input:focus,#props select:focus{border-color:#2f6fa8}
#props .danger{width:100%;justify-content:center;background:#3a1622;color:#fda4af;
  border:1px solid #58202f;margin-top:10px}
#props .danger:hover{background:#4c1b2b}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:7px;cursor:pointer;border:2px solid transparent}
.sw.on{border-color:#fff}

/* ---------- floating label editor ---------- */
#labelEditor{position:absolute;display:none;z-index:50;width:150px;text-align:center;
  background:#0c1322;border:1px solid var(--accent);color:var(--text);border-radius:7px;
  padding:5px 8px;font-size:12px;font-family:inherit;outline:none;
  box-shadow:0 6px 20px rgba(0,0,0,.5)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(5,9,18,.72);display:none;
  align-items:center;justify-content:center;z-index:200}
.modal{width:min(440px,92vw);background:var(--panel);border:1px solid var(--border2);
  border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.55);overflow:hidden}
.modal header{display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px}
.mbody{padding:16px 20px}
.mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.primary{background:#1d3a5c;color:var(--accent);border:1px solid #2f6fa8}
.primary:hover{background:#234a75;color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/>
        <path d="M10.8 7.1 6.2 16.1M13.2 7.1l4.6 9M7.4 18h9.2"/>
      </svg>
      NetDraw <span class="sub">network diagrams</span>
    </div>
    <div class="tgroup" id="tools">
      <button data-tool="select" class="active" title="Select / Move  (V)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M5 3l14 8.5-6.2 1.4L9.5 19z"/></svg>
      </button>
      <button data-tool="connect" title="Connect  (C)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="5.5" cy="18.5" r="2.8"/><circle cx="18.5" cy="5.5" r="2.8"/><path d="M7.6 16.4 16.4 7.6"/></svg>
      </button>
      <button data-tool="zone" title="Draw zone / network segment  (Z)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3.5" y="5" width="17" height="14" rx="3.5" stroke-dasharray="4.2 3.2"/></svg>
      </button>
      <button data-tool="pan" title="Pan  (H, or hold Space)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10m0-5.5a1.5 1.5 0 0 1 3 0V10m0-4a1.5 1.5 0 0 1 3 0v5m0-2.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.8a6 6 0 0 1-4.9-2.6L4.6 15c-.9-1.3-.4-2.8 1-3.2.9-.2 1.8.2 2.3 1l.9 1.4"/></svg>
      </button>
    </div>
    <div class="sep"></div>
    <div class="tgroup">
      <button id="btnZoomOut" title="Zoom out"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button id="zoomPct" title="Reset zoom to 100%">100%</button>
      <button id="btnZoomIn" title="Zoom in"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="btnFit" title="Fit diagram  (F)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 5 4 9.5 8.5 14"/><path d="M4 9.5h10a6 6 0 0 1 0 12h-3"/><path d="M15.5 19 20 14.5 15.5 10" opacity="0"/></svg></button>
    </div>
    <div class="spacer"></div>
    <div class="tgroup">
      <button id="btnSave" title="Save diagram as JSON file (Ctrl+S)"><span class="btn-text">Save</span></button>
      <button id="btnOpen" title="Open diagram JSON file"><span class="btn-text">Open</span></button>
      <button id="btnPng" title="Export as PNG image"><span class="btn-text">PNG</span></button>
      <button id="btnClear" title="Clear canvas"><span class="btn-text">Clear</span></button>
    </div>
  </div>

  <div id="main">
    <div id="palette"></div>
    <div id="canvasWrap">
      <svg id="canvas" class="tool-select" xmlns="http://www.w3.org/2000/svg">
        <g id="v Zones go here first (render order) --"><g id="gZones"></g><g id="gEdges"></g><g id="gNodes"></g></g>
      </svg>
      <div id="hintbar"><b>V</b> select &nbsp;·&nbsp; <b>C</b> connect &nbsp;·&nbsp; <b>Z</b> zone &nbsp;·&nbsp; drag ports to link &nbsp;·&nbsp; <b>double-click</b> rename &nbsp;·&nbsp; <b>Del</b> delete &nbsp;·&nbsp; <b>Space</b>+drag pan</div>
      <div id="props">
        <h3 id="propsTitle">Properties</h3>
        <label>Label</label><input type="text" id="pLabel">
        <label>Color</label><div class="swatches" id="pSwatches"></div>
        <button class="danger" id="pDelete">Delete</button>
      </div>
      <input id="labelEditor" type="text" placeholder="label">
    </div>
  </div>
</div>

<div class="overlay" id="confirmOverlay"><div class="modal">
  <header>Clear canvas<button id="cfClose" title="Close (Esc)">✕</button></header>
  <div class="mbody">Remove all nodes, links and zones?<div class="mrow">
    <button id="cfCancel">Cancel</button><button class="primary" id="cfOk">Clear</button>
  </div></div>
</div></div>

<script>
'use strict';
/* ===================== model ===================== */
const COLORS = ['#38bdf8','#a78bfa','#4ade80','#fbbf24','#fb7185','#94a3b8'];
const SHAPES = {
  router:  {cat:'Network',  draw:g=>ic(g,'<circle cx="12" cy="12" r="7.5"/><path d="M12 4.5v15M4.5 12h15M6.8 6.8c3 3 7.4 3 10.4 0M6.8 17.2c3-3 7.4-3 10.4 0"/>')},
  switch:  {cat:'Network',  draw:g=>ic(g,'<rect x="3.5" y="8" width="17" height="8" rx="2"/><path d="M7 11v2M10 11v2M13 11v2M16 11v2"/>')},
  firewall:{cat:'Security', draw:g=>ic(g,'<path d="M12 3.5 19 6v5.5c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/><path d="M8.5 12h7M8.5 9.5h7"/>')},
  server:  {cat:'Compute',  draw:g=>ic(g,'<rect x="4.5" y="4" width="15" height="5.4" rx="1.6"/><rect x="4.5" y="14.6" width="15" height="5.4" rx="1.6"/><path d="M7.5 6.7h.01M7.5 17.3h.01"/>')},
  cloud:   {cat:'External', draw:g=>ic(g,'<path d="M7 18a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 8.6 3.8 3.8 0 0 1 16.8 16z"/>')},
  plc:     {cat:'OT / ICS', draw:g=>ic(g,'<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M7.5 10h2M7.5 14h2M12 10h2M12 14h2"/>')},
  workstation:{cat:'OT / ICS', draw:g=>ic(g,'<rect x="3.5" y="5" width="17" height="11" rx="1.8"/><path d="M9 19.5h6M12 16v3.5"/>')},
  database:{cat:'Compute',  draw:g=>ic(g,'<ellipse cx="12" cy="6.5" rx="7" ry="2.8"/><path d="M5 6.5v11c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-11"/><path d="M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/>')},
};
let nid=1, eid=1, zid=1;
let nodes=[], edges=[], zones=[];
let tool='select', view={x:0,y:0,k:1};
let sel=null;               // {type:'node'|'edge'|'zone', id}
let drag=null, panning=null, spaceHeld=false, connectFrom=null, zoneDraw=null;

const $=q=>document.querySelector(q);
const svg=$('#canvas'), gZ=$('#gZones'), gE=$('#gEdges'), gN=$('#gNodes');
const NS='http://www.w3.org/2000/svg';
const el=(t,a={})=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
function ic(g,path){g.innerHTML='<g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(12,12) scale(1.15) translate(-12,-12)">'+path+'</g>';}
const esc=s=>{const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;};

/* ===================== palette ===================== */
(function buildPalette(){
  const cats={};
  for(const [k,v] of Object.entries(SHAPES)) (cats[v.cat]??=[]).push(k);
  const pal=$('#palette');
  for(const cat of Object.keys(cats)){
    const grp=document.createElement('div');grp.className='pgroup';
    grp.innerHTML='<h3>'+esc(cat)+'</h3><div class="pitems"></div>';
    const items=grp.querySelector('.pitems');
    for(const key of cats[cat]){
      const it=document.createElement('div');it.className='pitem';it.dataset.shape=key;
      it.innerHTML='<div class="pic"></div><div class="pname">'+esc(key)+'</div>';
      SHAPES[key].draw(it.querySelector('.pic'));
      it.querySelector('.pic').style.color='var(--accent)';
      it.addEventListener('pointerdown',ev=>startPaletteDrag(ev,key));
      items.appendChild(it);
    }
    pal.appendChild(grp);
  }
})();
function startPaletteDrag(ev,key){
  ev.preventDefault();
  const ghost=document.createElement('div');
  ghost.className='pitem';ghost.style.cssText='position:fixed;z-index:100;pointer-events:none;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:10px 16px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:12px;font-weight:600';
  ghost.textContent=key;document.body.appendChild(ghost);
  const mv=e=>{ghost.style.left=(e.clientX+12)+'px';ghost.style.top=(e.clientY+12)+'px';};
  mv(ev);
  const up=e=>{
    window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
    ghost.remove();
    const r=svg.getBoundingClientRect();
    if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
      const p=toWorld(e.clientX,e.clientY);
      addNode(key,p.x-52,p.y-26);setTool('select');
    }
  };
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);
}

/* ===================== model ops ===================== */
function addNode(shape,x,y,label,color){
  const n={id:'n'+(nid++),shape,x,y,label:label||shape,color:color||COLORS[0]};
  nodes.push(n);render();select({type:'node',id:n.id});return n;
}
function addZone(x,y,w,h,label){
  const z={id:'z'+(zid++),x,y,w:Math.max(w,40),h:Math.max(h,40),label:label||'zone'};
  zones.push(z);render();select({type:'zone',id:z.id});return z;
}
function addEdge(a,b){
  if(a===b)return;
  if(edges.some(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)))return;
  edges.push({id:'e'+(eid++),a,b,anim:false});render();
}
function delSel(){
  if(!sel)return;
  if(sel.type==='node'){edges=edges.filter(e=>e.a!==sel.id&&e.b!==sel.id);nodes=nodes.filter(n=>n.id!==sel.id);}
  else if(sel.type==='edge')edges=edges.filter(e=>e.id!==sel.id);
  else if(sel.type==='zone')zones=zones.filter(z=>z.id!==sel.id);
  sel=null;hideProps();render();
}

/* ===================== view transform ===================== */
function toWorld(cx,cy){const r=svg.getBoundingClientRect();return{x:(cx-r.left-view.x)/view.k,y:(cy-r.top-view.y)/view.k};}
function applyView(){svg.setAttribute('viewBox',`0 0 ${svg.clientWidth} ${svg.clientHeight}`);const g=svg.firstElementChild;g.setAttribute('transform',`translate(${view.x},${view.y}) scale(${view.k})`);$('#zoomPct').textContent=Math.round(view.k*100)+'%';}
window.addEventListener('resize',()=>{applyView();});
function zoomAt(cx,cy,f){
  const r=svg.getBoundingClientRect(),px=cx-r.left,py=cy-r.top;
  const k2=Math.min(4,Math.max(.2,view.k*f));
  view.x=px-(px-view.x)*k2/view.k;view.y=py-(py-view.y)*k2/view.k;view.k=k2;applyView();
}
function fit(){
  if(!nodes.length&&!zones.length){view={x:0,y:0,k:1};applyView();return;}
  const xs=nodes.map(n=>n.x).concat(zones.map(z=>z.x));
  const ys=nodes.map(n=>n.y).concat(zones.map(z=>z.y));
  const xe=nodes.map(n=>n.x+104).concat(zones.map(z=>z.x+z.w));
  const ye=nodes.map(n=>n.y+52).concat(zones.map(z=>z.y+z.h));
  const minX=Math.min(...xs)-40,minY=Math.min(...ys)-40,maxX=Math.max(...xe)+40,maxY=Math.max(...ye)+40;
  const k=Math.min(svg.clientWidth/(maxX-minX),svg.clientHeight/(maxY-minY),1.5);
  view.k=k;view.x=-minX*k+((svg.clientWidth-(maxX-minX)*k)/2);view.y=-minY*k+((svg.clientHeight-(maxY-minY)*k)/2);applyView();
}

/* ===================== render ===================== */
function render(){
  gZ.innerHTML='';gE.innerHTML='';gN.innerHTML='';
  /* zones */
  for(const z of zones){
    const g=el('g',{class:'zoneg','data-id':z.id});
    g.appendChild(el('rect',{x:z.x,y:z.y,width:z.w,height:z.h,rx:12,fill:'rgba(56,189,248,.04)',stroke:sel&&sel.type==='zone'&&sel.id===z.id?'#7dd3fc':'#24304e','stroke-width':1.4,'stroke-dasharray':'6 4'}));
    const t=el('text',{x:z.x+10,y:z.y+18,fill:'#5b6b85','font-size':11,'font-weight':600});t.textContent=z.label;g.appendChild(t);
    gZ.appendChild(g);
  }
  /* edges */
  for(const e of edges){
    const a=nodes.find(n=>n.id===e.a),b=nodes.find(n=>n.id===e.b);if(!a||!b)continue;
    const g=el('g',{class:'edge'+(sel&&sel.type==='edge'&&sel.id===e.id?' sel':''),'data-id':e.id});
    g.appendChild(el('line',{x1:a.x+52,y1:a.y+26,x2:b.x+52,y2:b.y+26,stroke:'transparent','stroke-width':10}));
    g.appendChild(el('line',{class:'vis',x1:a.x+52,y1:a.y+26,x2:b.x+52,y2:b.y+26,stroke:sel&&sel.type==='edge'&&sel.id===e.id?'#7dd3fc':'#3b4a68','stroke-width':1.8}));
    gE.appendChild(g);
  }
  /* nodes */
  for(const n of nodes){
    const g=el('g',{class:'nodeg',transform:`translate(${n.x},${n.y})`,'data-id':n.id});
    const on=sel&&sel.type==='node'&&sel.id===n.id;
    g.appendChild(el('rect',{x:6,y:6,width:104,height:52,rx:11,fill:'rgba(0,0,0,.35)'})); // shadow
    g.appendChild(el('rect',{x:0,y:0,width:104,height:52,rx:11,fill:'var(--card)',stroke:on?'#7dd3fc':n.color,'stroke-width':on?2:1.5}));
    const iconBox=el('g',{transform:'translate(14,14)'});iconBox.style.color=n.color;
    const inner=el('g');SHAPES[n.shape].draw(inner);
    const scaled=el('g',{transform:'scale(1.05) translate(4,4)'});scaled.appendChild(inner);iconBox.appendChild(scaled);g.appendChild(iconBox);
    const t=el('text',{x:52,y:44,'text-anchor':'middle',fill:'var(--text)','font-size':11,'font-weight':600});t.textContent=n.label;g.appendChild(t);
    /* ports */
    const ports=el('g',{class:'ports'});
    [[52,0],[52,52],[0,26],[104,26]].forEach(([px,py])=>{
      ports.appendChild(el('circle',{class:'port',cx:px,cy:py,r:4.5,fill:'#0b1120',stroke:n.color,'stroke-width':1.6,'data-node':n.id}));
    });
    g.appendChild(ports);
    gN.appendChild(g);
  }
  applyView();
}

/* ===================== selection / props ===================== */
function select(s){sel=s;render();showProps();}
function hideProps(){$('#props').style.display='none';}
function showProps(){
  if(!sel)return hideProps();
  const p=$('#props');
  if(sel.type==='node'){
    const n=nodes.find(x=>x.id===sel.id);if(!n)return hideProps();
    $('#propsTitle').textContent='Node';$('#pLabel').value=n.label;
    buildSwatches(n.color,c=>{n.color=c;render();showProps();});
    p.style.display='block';
  }else if(sel.type==='zone'){
    const z=zones.find(x=>x.id===sel.id);if(!z)return hideProps();
    $('#propsTitle').textContent='Zone';$('#pLabel').value=z.label;
    $('#pSwatches').innerHTML='';
    p.style.display='block';
  }else if(sel.type==='edge'){
    $('#propsTitle').textContent='Link';$('#pLabel').value='';
    $('#pSwatches').innerHTML='';p.style.display='none';return;
  }
}
function buildSwatches(cur,cb){
  const w=$('#pSwatches');w.innerHTML='';
  COLORS.forEach(c=>{
    const s=document.createElement('div');s.className='sw'+(c===cur?' on':'');s.style.background=c;
    s.onclick=()=>cb(c);w.appendChild(s);
  });
}
$('#pLabel').addEventListener('input',()=>{
  if(!sel)return;
  if(sel.type==='node'){const n=nodes.find(x=>x.id===sel.id);if(n)n.label=$('#pLabel').value;}
  if(sel.type==='zone'){const z=zones.find(x=>x.id===sel.id);if(z)z.label=$('#pLabel').value;}
  render();
});
$('#pDelete').onclick=delSel;

/* ===================== tools ===================== */
function setTool(t){
  tool=t;
  document.querySelectorAll('#tools button').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));
  svg.className.baseVal='tool-'+t;
}
document.querySelectorAll('#tools button').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));

/* ===================== pointer interaction ===================== */
svg.addEventListener('pointerdown',ev=>{
  svg.focus();
  const pt=toWorld(ev.clientX,ev.clientY);
  const portEl=ev.target.closest('.port');
  if(portEl){connectFrom=portEl.dataset.node;
    const g=el('g',{id:'tmpLine'});g.appendChild(el('line',{id:'tmpline',x1:pt.x,y1:pt.y,x2:pt.x,y2:pt.y,stroke:'#7dd3fc','stroke-width':1.8,'stroke-dasharray':'5 4'}));svg.firstElementChild.appendChild(g);
    return;
  }
  if(tool==='connect'){
    const ng=ev.target.closest('g.nodeg');
    if(ng){if(connectFrom)addEdge(connectFrom,ng.dataset.id),connectFrom=null;else connectFrom=ng.dataset.id;}
    return;
  }
  if(tool==='zone'){zoneDraw={x0:pt.x,y0:pt.y,x1:pt.x,y1:pt.y};return;}
  if(tool==='pan'||spaceHeld){panning={sx:ev.clientX,sy:ev.clientY,vx:view.x,vy:view.y};svg.classList.add('panning');return;}
  const eg=ev.target.closest('g.edge');
  const zg=ev.target.closest('g.zoneg');
  const ng=ev.target.closest('g.nodeg');
  if(ng){select({type:'node',id:ng.dataset.id});
    const n=nodes.find(x=>x.id===ng.dataset.id);
    drag={n,dx:pt.x-n.x,dy:pt.y-n.y,moved:false};}
  else if(eg)select({type:'edge',id:eg.dataset.id});
  else if(zg){select({type:'zone',id:zg.dataset.id});
    const z=zones.find(x=>x.id===zg.dataset.id);
    drag={zone:z,dx:pt.x-z.x,dy:pt.y-z.y,moved:false};}
  else{sel=null;hideProps();render();}
});
window.addEventListener('pointermove',ev=>{
  if(panning){view.x=panning.vx+(ev.clientX-panning.sx);view.y=panning.vy+(ev.clientY-panning.sy);applyView();return;}
  if(connectFrom){const l=document.getElementById('tmpline');if(l){const p=toWorld(ev.clientX,ev.clientY);l.setAttribute('x2',p.x);l.setAttribute('y2',p.y);}return;}
  if(zoneDraw){const p=toWorld(ev.clientX,ev.clientY);zoneDraw.x1=p.x;zoneDraw.y1=p.y;
    let r=document.getElementById('tmpzone');
    if(!r){r=el('rect',{id:'tmpzone',fill:'rgba(56,189,248,.06)',stroke:'#38bdf8','stroke-dasharray':'6 4'});svg.firstElementChild.appendChild(r);}
    r.setAttribute('x',Math.min(zoneDraw.x0,zoneDraw.x1));r.setAttribute('y',Math.min(zoneDraw.y0,zoneDraw.y1));
    r.setAttribute('width',Math.abs(zoneDraw.x1-zoneDraw.x0));r.setAttribute('height',Math.abs(zoneDraw.y1-zoneDraw.y0));return;}
  if(drag){const p=toWorld(ev.clientX,ev.clientY);drag.moved=true;
    if(drag.n){drag.n.x=p.x-drag.dx;drag.n.y=p.y-drag.dy;}
    if(drag.zone){drag.zone.x=p.x-drag.dx;drag.zone.y=p.y-drag.dy;}
    render();}
});
window.addEventListener('pointerup',ev=>{
  if(connectFrom){
    const g=document.getElementById('tmpLine');if(g)g.remove();
    const ng=ev.target.closest&&ev.target.closest('g.nodeg');
    const portEl=ev.target.closest&&ev.target.closest('.port');
    if(portEl&&portEl.dataset.node!==connectFrom)addEdge(connectFrom,portEl.dataset.node);
    else if(ng&&ng.dataset.id!==connectFrom)addEdge(connectFrom,ng.dataset.id);
    connectFrom=null;return;
  }
  if(zoneDraw){
    document.getElementById('tmpzone')?.remove();
    const w=Math.abs(zoneDraw.x1-zoneDraw.x0),h=Math.abs(zoneDraw.y1-zoneDraw.y0);
    if(w>30&&h>30)addZone(Math.min(zoneDraw.x0,zoneDraw.x1),Math.min(zoneDraw.y0,zoneDraw.y1),w,h);
    zoneDraw=null;setTool('select');return;
  }
  panning=null;svg.classList.remove('panning');
  if(drag&&drag.moved)render();
  drag=null;
});
svg.addEventListener('dblclick',ev=>{
  const ng=ev.target.closest('g.nodeg'),zg=ev.target.closest('g.zoneg');
  const ed=$('#labelEditor');
  const target=ng||zg;if(!target)return;
  const type=ng?'node':'zone',id=target.dataset.id;
  const obj=(type==='node'?nodes:zones).find(o=>o.id===id);
  const r=svg.getBoundingClientRect();
  ed.style.display='block';
  ed.style.left=((type==='node'?obj.x+52:obj.x+obj.w/2)*view.k+view.x+r.left-75)+'px';
  ed.style.top=((type==='node'?obj.y+26:obj.y+18)*view.k+view.y+r.top-14)+'px';
  ed.value=obj.label;ed.focus();ed.select();
  const done=()=>{obj.label=ed.value||obj.label;ed.style.display='none';ed.onblur=null;render();};
  ed.onblur=done;
  ed.onkeydown=e=>{if(e.key==='Enter')ed.blur();if(e.key==='Escape'){ed.onblur=null;ed.style.display='none';}};
});

/* ===================== wheel / keys ===================== */
svg.addEventListener('wheel',ev=>{ev.preventDefault();zoomAt(ev.clientX,ev.clientY,ev.deltaY<0?1.12:0.89);},{passive:false});
window.addEventListener('keydown',ev=>{
  if(ev.target.tagName==='INPUT'||ev.target.tagName==='TEXTAREA')return;
  if(ev.code==='Space'){spaceHeld=true;ev.preventDefault();return;}
  const k=ev.key.toLowerCase();
  if(k==='v')setTool('select');else if(k==='c')setTool('connect');else if(k==='z')setTool('zone');else if(k==='h'||k==='f'&&false)setTool('pan');
  else if(k==='f')fit();
  else if(ev.key==='Delete'||ev.key==='Backspace')delSel();
  else if(ev.key==='Escape'){sel=null;hideProps();render();}
});
window.addEventListener('keyup',ev=>{if(ev.code==='Space')spaceHeld=false;});

/* ===================== zoom buttons / topbar ===================== */
$('#btnZoomIn').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.15);};
$('#btnZoomOut').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.87);};
$('#zoomPct').onclick=()=>{view={x:0,y:0,k:1};applyView();};
$('#btnFit').onclick=fit;
$('#btnClear').onclick=()=>$('#confirmOverlay').style.display='flex';
$('#cfClose').onclick=$('#cfCancel').onclick=()=>$('#confirmOverlay').style.display='none';
$('#cfOk').onclick=()=>{nodes=[];edges=[];zones=[];sel=null;hideProps();render();$('#confirmOverlay').style.display='none';};
$('#btnSave').onclick=()=>download('diagram.json',JSON.stringify({nodes,edges,zones},null,2));
$('#btnOpen').onclick=()=>{
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);
      nodes=d.nodes||[];edges=d.edges||[];zones=d.zones||[];
      nid=Math.max(0,...nodes.map(n=>+String(n.id).slice(1)))+1;
      eid=Math.max(0,...edges.map(e=>+String(e.id).slice(1)))+1;
      zid=Math.max(0,...zones.map(z=>+String(z.id).slice(1)))+1;
      sel=null;hideProps();render();fit();
    }catch(e){alert('Not a valid diagram JSON');}};
    rd.readAsText(f);};
  i.click();
};
$('#btnPng').onclick=()=>{
  const old=view;fit();
  const xml=new XMLSerializer().serializeToString(svg);
  view=old;applyView();
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas');c.width=svg.clientWidth*2;c.height=svg.clientHeight*2;
    const ctx=c.getContext('2d');ctx.fillStyle='#0b1120';ctx.fillRect(0,0,c.width,c.height);
    ctx.scale(2,2);ctx.drawImage(img,0,0);
    c.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='diagram.png';a.click();URL.revokeObjectURL(u);});
  };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml);
};
function download(name,text){const b=new Blob([text],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}
window.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();$('#btnSave').click();}});

/* ===================== seed demo ===================== */
const z=addZone(80,60,640,420,'DMZ');z.label='DMZ';
const r1=addNode('router',120,110,'edge-router','#38bdf8');
const f1=addNode('firewall',300,110,'fw-dmz-01','#fb7185');
const s1=addNode('switch',480,110,'sw-core-01','#a78bfa');
const sv=addNode('server',280,280,'app-01','#4ade80');
const ws=addNode('workstation',480,280,'eng-ws-02','#fbbf24');
addEdge(r1.id,f1.id);addEdge(f1.id,s1.id);addEdge(s1.id,sv.id);addEdge(s1.id,ws.id);
sel=null;hideProps();render();fit();
</script>
